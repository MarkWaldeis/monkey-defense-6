<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Monkey Defense 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;background:#0a0a14;
  font-family:'Nunito',Segoe UI,Arial,sans-serif;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  position:fixed;inset:0;
}
canvas{
  display:block;margin:0;cursor:default;background:#0a0a14;
  position:fixed;inset:0;width:100%;height:100%;z-index:1;
  touch-action:none;
}
#uiRoot{position:fixed;inset:0;pointer-events:none;z-index:20;touch-action:manipulation}
#uiRoot .btd-interactive{pointer-events:auto}
#btdMapSelect:not(.hidden),#btdSidebar:not(.hidden),#btdUpgradePanel:not(.hidden){pointer-events:auto}
.hidden{display:none!important;pointer-events:none!important}
#btdMapSelect{z-index:30}
#btdSidebar{z-index:25}
.btd-map-card,.btd-map-card *{cursor:pointer}
.btd-map-thumb{pointer-events:none} /* clicks go to card */

/* ─── BTD MAP SELECT ─── */
#btdMapSelect{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1a3d15 center/cover no-repeat;
  overflow:hidden;
}
#btdMapSelect::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55));
  pointer-events:none;
}
.btd-back{
  position:absolute;top:18px;left:18px;z-index:2;
  width:54px;height:54px;border-radius:50%;border:3px solid #fff;
  background:linear-gradient(180deg,#5bb8ff,#2a7fd4);color:#fff;font-size:28px;font-weight:900;
  cursor:pointer;box-shadow:0 4px 0 #1a5a9a,0 6px 12px rgba(0,0,0,.35);
  transition:transform .15s ease-out;
}
.btd-back:hover{transform:scale(1.08)}
.btd-back:active{transform:scale(.95)}
.btd-map-stage{position:relative;z-index:1;width:min(1100px,92vw);display:flex;align-items:center;gap:12px}
.btd-arrow{
  flex:0 0 48px;height:64px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#ffb347,#e8912d);color:#fff;font-size:28px;font-weight:900;
  box-shadow:0 4px 0 #b86b12;transition:transform .15s ease-out;
}
.btd-arrow:hover{transform:scale(1.1)}
.btd-arrow:active{transform:scale(.92)}
.btd-map-viewport{flex:1;overflow:hidden;position:relative;min-height:360px}
.btd-map-track{
  display:flex;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform;
}
.btd-map-page{
  min-width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 22px;padding:8px 12px;
}
.btd-map-card{
  background:linear-gradient(180deg,#e8dcc8,#d4c5a9 40%,#c4b08a);
  border-radius:18px;padding:10px 10px 14px;cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.35);
  border:2px solid #a89068;transition:transform .2s ease-out,box-shadow .2s ease-out;
  animation:cardIn .35s ease-out both;
}
.btd-map-card:nth-child(1){animation-delay:.05s}
.btd-map-card:nth-child(2){animation-delay:.1s}
.btd-map-card:nth-child(3){animation-delay:.15s}
.btd-map-card:nth-child(4){animation-delay:.2s}
.btd-map-card:nth-child(5){animation-delay:.25s}
.btd-map-card:nth-child(6){animation-delay:.3s}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.btd-map-card:hover{transform:scale(1.05);box-shadow:0 0 0 3px #f5c542,0 10px 24px rgba(0,0,0,.4)}
.btd-map-card:active{transform:scale(.96)}
.btd-map-card.locked{filter:grayscale(.5) brightness(.75);cursor:not-allowed}
.btd-map-card.locked:hover{transform:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 8px 18px rgba(0,0,0,.35)}
.btd-map-title{
  font-family:'Luckiest Guy',cursive;font-size:clamp(14px,1.6vw,20px);color:#1a1a1a;
  text-align:center;margin-bottom:6px;
  text-shadow:1px 0 #fff,-1px 0 #fff,0 1px #fff,0 -1px #fff,0 2px 2px rgba(0,0,0,.25);
  letter-spacing:.5px;text-transform:uppercase;
}
.btd-map-thumb{
  width:100%;aspect-ratio:16/10;border-radius:10px;object-fit:cover;display:block;
  border:2px solid #8a7348;background:#3d6b2e;
}
.btd-map-stars{text-align:center;margin-top:6px;color:#f5c542;font-size:14px;text-shadow:0 1px 2px #000}
.btd-dots{display:flex;gap:8px;justify-content:center;margin-top:14px;z-index:1;position:relative}
.btd-dot{width:10px;height:10px;border-radius:50%;background:#5a6a5a;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.btd-dot.on{background:#fff;box-shadow:0 0 8px #fff}
.btd-diff-bar{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:28px;align-items:flex-end;z-index:2;
}
.btd-diff{
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  transition:transform .2s ease-out;border:none;background:transparent;color:#fff;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.7);
}
.btd-diff:hover{transform:scale(1.08)}
.btd-diff .medal{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;
  border:3px solid rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.4);
  transition:transform .2s,box-shadow .2s;
}
.btd-diff.active .medal{transform:scale(1.15);box-shadow:0 0 16px currentColor,0 4px 12px rgba(0,0,0,.4)}
.btd-diff.beginner .medal{background:radial-gradient(circle at 35% 30%,#8fd4ff,#2b7fd4);color:#8fd4ff}
.btd-diff.intermediate .medal{background:radial-gradient(circle at 35% 30%,#ffe08a,#e8912d);color:#f5a623}
.btd-diff.advanced .medal{background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828);color:#ef5350}
.btd-diff.expert .medal{background:radial-gradient(circle at 35% 30%,#666,#1a1a1a);color:#ff7043}
.btd-hero{
  position:absolute;bottom:22px;left:22px;z-index:2;
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;
  background:rgba(0,0,0,.35);border:2px solid #4ecdc4;color:#fff;font-weight:800;font-size:12px;
  cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);
}
.btd-hero img{width:40px;height:40px;border-radius:50%;border:2px solid #4ecdc4;background:#2d5a27;object-fit:contain}

/* ─── BTD TOWER SIDEBAR ─── */
#btdSidebar{
  --side-w: min(220px, 22vw);
  position:absolute;top:0;bottom:0;width:var(--side-w);
  background:linear-gradient(90deg,#6b4d12 0%,#8b6914 12%,#a0784c 50%,#8b6914 88%,#5a3d0e 100%);
  display:flex;flex-direction:column;padding:14px 10px 14px;z-index:5;
  transition:left .22s cubic-bezier(.2,.8,.2,1), right .22s cubic-bezier(.2,.8,.2,1),
    box-shadow .22s ease, border-color .22s ease;
}
/* default / right dock */
#btdSidebar, #btdSidebar.side-right{
  right:0; left:auto;
  border-left:4px solid #3e2a0a; border-right:none;
  box-shadow:-10px 0 28px rgba(0,0,0,.5), inset 2px 0 0 rgba(255,255,255,.15);
}
/* left dock — free right side for placing */
#btdSidebar.side-left{
  left:0; right:auto;
  border-right:4px solid #3e2a0a; border-left:none;
  background:linear-gradient(270deg,#6b4d12 0%,#8b6914 12%,#a0784c 50%,#8b6914 88%,#5a3d0e 100%);
  box-shadow:10px 0 28px rgba(0,0,0,.5), inset -2px 0 0 rgba(255,255,255,.15);
}
.btd-upg-btn{
  background:linear-gradient(180deg,#7ed957,#3faa2a 55%,#2d8a1c);
  border:3px solid #1f6b14;border-radius:16px;color:#fff;font-family:'Luckiest Guy',cursive;
  font-size:clamp(16px,1.5vw,20px);letter-spacing:1px;padding:12px 6px;cursor:pointer;
  text-shadow:0 2px 0 #1a5a12;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #1a5a12;
  transition:transform .15s;
}
.btd-upg-btn:hover{transform:scale(1.04)}
.btd-upg-btn:active{transform:scale(.96)}
.btd-sel-name{
  margin:10px 2px 8px;background:linear-gradient(180deg,#fff8e7,#e8dcc8);
  border-radius:10px;border:2px solid #c4a86a;text-align:center;
  font-family:'Luckiest Guy',cursive;font-size:clamp(13px,1.2vw,16px);color:#1a1a1a;padding:8px 4px;
  text-shadow:0 1px 0 #fff;line-height:1.15;
}
.btd-tower-grid{
  flex:1;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;
  padding:4px 2px 10px;align-content:start;
  scrollbar-width:thin;scrollbar-color:#c4a86a transparent;
}
.btd-tower-cell{
  position:relative;aspect-ratio:1;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#d8d0c0,#b8b0a0);
  border:3px solid #7a7260;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .15s ease-out,box-shadow .15s,border-color .15s;
}
.btd-tower-cell:hover{transform:scale(1.08);box-shadow:0 0 14px rgba(245,198,66,.55)}
.btd-tower-cell.selected{border-color:#f5c542;box-shadow:0 0 0 3px #f5c542,0 0 16px rgba(245,198,66,.75);transform:scale(1.06)}
.btd-tower-cell.locked{filter:brightness(.55);cursor:not-allowed}
.btd-tower-cell.locked:hover{transform:none;box-shadow:none}
.btd-tower-cell.cant-afford .btd-price{color:#e53935}
.btd-tower-cell img{width:78%;height:78%;object-fit:contain;pointer-events:none;background:transparent}
.btd-price{font-size:clamp(12px,1.1vw,15px);font-weight:900;color:#2e7d32;text-shadow:0 1px 0 rgba(255,255,255,.5);margin-top:2px}
.btd-lock{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  font-size:20px;filter:drop-shadow(0 1px 1px #000);
}
.btd-side-actions{display:flex;gap:10px;margin-top:8px}
.btd-side-actions button{
  flex:1;height:52px;border-radius:14px;border:2px solid rgba(0,0,0,.2);cursor:pointer;
  font-size:22px;font-weight:900;color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.25);
  transition:transform .12s;
}
.btd-side-actions button:hover{transform:scale(1.06)}
.btd-side-actions button:active{transform:scale(.94)}
.btd-btn-ability{background:linear-gradient(180deg,#7ee8ff,#29b6f6 55%,#0288d1)}
.btd-btn-ff{background:linear-gradient(180deg,#9dff6a,#43a047 55%,#2e7d32)}
.btd-btn-ff.active{box-shadow:0 0 0 2px #fff,0 0 12px #76ff03}

/* drag ghost */
#dragGhost{
  position:fixed;pointer-events:none;z-index:50;opacity:.75;width:88px;height:88px;
  display:none;transform:translate(-50%,-50%);
}
#dragGhost img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
#rangePreview{
  position:fixed;pointer-events:none;z-index:40;display:none;border:2px solid rgba(255,255,255,.45);
  border-radius:50%;background:rgba(255,255,255,.08);transform:translate(-50%,-50%);
}

/* ─── BTD6 UPGRADE PANEL (3 paths × 5 tiers) ─── */
#btdUpgradePanel{
  position:absolute;top:48px;bottom:10px;width:min(300px,28vw);z-index:40;
  display:none;flex-direction:column;
  background:linear-gradient(180deg,#c4a574 0%,#a88855 12%,#8b6f3f 50%,#7a6035 100%);
  border:3px solid #5a4320;border-radius:16px 0 0 16px;
  box-shadow:-8px 0 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);
  padding:10px 10px 12px;pointer-events:auto !important;
  font-family:'Nunito',sans-serif;
}
#btdUpgradePanel:not(.hidden){display:flex;pointer-events:auto !important}
#btdUpgradePanel button,#btdUpgradePanel .btd-path-buy{pointer-events:auto !important;position:relative;z-index:2}
#btdUpgradePanel.side-left{
  left:0;right:auto;border-radius:0 16px 16px 0;
  box-shadow:8px 0 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);
}
#btdUpgradePanel.side-right{right:var(--side-w,220px);left:auto}
#btdUpgradePanel.side-right.dock-left{right:auto;left:0;border-radius:0 16px 16px 0}
.btd-upg-head{
  display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px;
  background:linear-gradient(180deg,#fff8e7,#e8d4b0);border-radius:12px;border:2px solid #a89060;
}
.btd-upg-head img{
  width:64px;height:64px;object-fit:contain;border-radius:10px;
  background:radial-gradient(circle at 40% 30%,#7ec850,#3d8c2e);border:2px solid #2d6b1e;
}
.btd-upg-head-text{flex:1;min-width:0}
.btd-upg-title{
  font-family:'Luckiest Guy',cursive;font-size:18px;color:#1a1a1a;
  text-shadow:0 1px 0 #fff;line-height:1.1;
}
.btd-upg-code{
  font-weight:900;font-size:14px;color:#5d4037;margin-top:2px;
}
.btd-upg-stats{font-size:11px;color:#4e342e;font-weight:800;margin-top:2px;line-height:1.25}
.btd-upg-close{
  width:36px;height:36px;border-radius:50%;border:2px solid #fff;cursor:pointer;
  background:linear-gradient(180deg,#ef5350,#c62828);color:#fff;font-size:18px;font-weight:900;
  box-shadow:0 3px 0 #8e0000;
}
.btd-upg-paths{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.btd-path-row{
  display:flex;align-items:stretch;gap:8px;
  background:linear-gradient(180deg,rgba(255,248,230,.55),rgba(200,170,120,.35));
  border:2px solid #6d5428;border-radius:12px;padding:6px;
}
.btd-path-tiers{
  display:flex;flex-direction:column-reverse;justify-content:center;gap:3px;padding:2px 0;
}
.btd-tier-pip{
  width:14px;height:14px;border-radius:3px;border:2px solid #3e2a0a;
  background:#5a4a30;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.btd-tier-pip.on{
  background:linear-gradient(180deg,#9cff57,#43a047);border-color:#1b5e20;
  box-shadow:0 0 6px rgba(129,199,132,.8);
}
.btd-tier-pip.next{background:linear-gradient(180deg,#ffe082,#ffb300);border-color:#f57f17}
.btd-tier-pip.locked{opacity:.45}
.btd-path-buy{
  flex:1;display:flex;align-items:center;gap:8px;text-align:left;
  border:2px solid #5d4037;border-radius:10px;padding:6px 8px;cursor:pointer;
  background:linear-gradient(180deg,#efe0c0,#d4bc90);
  transition:transform .12s,box-shadow .12s;min-height:52px;
}
.btd-path-buy:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 0 2px #f5c542}
.btd-path-buy:disabled{cursor:not-allowed;filter:grayscale(.35);opacity:.75}
.btd-path-buy.can-buy{background:linear-gradient(180deg,#fff3c4,#ffd54f);border-color:#f9a825}
.btd-path-buy.owned-max{
  background:linear-gradient(180deg,#c8e6c9,#81c784);border-color:#2e7d32;cursor:default;
}
.btd-path-buy .nm{font-family:'Luckiest Guy',cursive;font-size:13px;color:#1a1a1a;line-height:1.1}
.btd-path-buy .ds{font-size:10px;font-weight:800;color:#5d4037;margin-top:2px}
.btd-path-buy .pr{font-weight:900;font-size:14px;color:#2e7d32;margin-left:auto;white-space:nowrap}
.btd-path-buy.cant .pr{color:#c62828}
.btd-path-buy .icon{font-size:22px;line-height:1}
.btd-upg-foot{display:flex;gap:8px;margin-top:8px}
.btd-upg-foot button{
  flex:1;height:44px;border-radius:12px;border:2px solid rgba(0,0,0,.25);cursor:pointer;
  font-family:'Luckiest Guy',cursive;font-size:15px;color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.25);
}
.btd-upg-target{background:linear-gradient(180deg,#64b5f6,#1565c0)}
.btd-upg-sell{background:linear-gradient(180deg,#ef9a9a,#c62828)}

/* ─── MOBILE / TOUCH LAYOUT ─── */
@media (max-width:900px), (max-height:620px), (pointer:coarse) {
  #btdMapSelect{
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
      max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    justify-content:flex-start;overflow-y:auto;overflow-x:hidden;
    touch-action:pan-y;
  }
  .btd-map-stage{width:100%;max-width:100%;gap:6px}
  .btd-map-viewport{min-height:min(42vh,280px)}
  .btd-map-page{
    grid-template-columns:repeat(2,1fr)!important;gap:10px 12px;padding:6px 4px;
  }
  .btd-map-title{font-size:clamp(11px,3.2vw,16px)}
  .btd-map-stars{font-size:10px}
  .btd-arrow{flex:0 0 36px;height:48px;font-size:20px}
  .btd-diff-bar{
    position:relative;bottom:auto;left:auto;transform:none;
    flex-wrap:wrap;justify-content:center;gap:10px 14px;margin:10px 0 8px;
  }
  .btd-diff .medal{width:44px;height:44px;font-size:20px}
  .btd-diff{font-size:10px}
  .btd-back{width:44px;height:44px;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
  .btd-hero{display:none}

  /* Tower bar: bottom strip (thumb-friendly) */
  #btdSidebar, #btdSidebar.side-right, #btdSidebar.side-left{
    top:auto!important;left:0!important;right:0!important;bottom:0!important;
    width:100%!important;height:auto;max-height:34vh;
    min-height:118px;
    flex-direction:row!important;align-items:stretch;
    padding:6px max(6px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
    border:none;border-top:4px solid #3e2a0a;
    background:linear-gradient(180deg,#8b6914 0%,#a0784c 40%,#6b4d12 100%)!important;
    box-shadow:0 -8px 24px rgba(0,0,0,.45)!important;
    gap:6px;
  }
  #btdSidebar .btd-upg-btn{
    flex:0 0 auto;align-self:center;font-size:12px;padding:10px 8px;writing-mode:horizontal-tb;
    max-width:72px;line-height:1.1;
  }
  #btdSidebar .btd-sel-name{
    display:none;
  }
  #btdSidebar .btd-tower-grid{
    flex:1;display:flex!important;grid-template-columns:none!important;
    flex-direction:row;overflow-x:auto;overflow-y:hidden;
    gap:8px;padding:4px 2px;align-content:center;align-items:center;
    -webkit-overflow-scrolling:touch;touch-action:pan-x;
    scrollbar-width:none;
  }
  #btdSidebar .btd-tower-grid::-webkit-scrollbar{display:none}
  #btdSidebar .btd-tower-cell{
    flex:0 0 64px;width:64px;height:64px;aspect-ratio:1;border-radius:12px;
  }
  #btdSidebar .btd-price{font-size:11px}
  #btdSidebar .btd-side-actions{
    flex:0 0 auto;flex-direction:column;gap:6px;margin:0;align-self:center;
  }
  #btdSidebar .btd-side-actions button{width:48px;height:40px;font-size:16px}

  /* Upgrade panel: bottom sheet above tower bar */
  #btdUpgradePanel,
  #btdUpgradePanel.side-right,
  #btdUpgradePanel.side-left,
  #btdUpgradePanel.side-right.dock-left{
    top:auto!important;left:0!important;right:0!important;
    bottom:calc(118px + env(safe-area-inset-bottom,0px))!important;
    width:100%!important;max-height:48vh;height:auto;
    border-radius:16px 16px 0 0!important;
    border-left:none;border-right:none;border-bottom:none;
    box-shadow:0 -10px 28px rgba(0,0,0,.5)!important;
    padding-bottom:8px;
  }
  .btd-upg-head img{width:48px;height:48px}
  .btd-upg-title{font-size:15px}
  .btd-upg-paths{max-height:28vh}
  .btd-path-buy{min-height:46px;padding:4px 6px}
  .btd-path-buy .nm{font-size:12px}
  .btd-path-buy .ds{font-size:9px}

  return list;

function loadAssets() {
  const list = buildAssetList();
  loadTotal = Math.max(1, list.length);
  loadProgress = 0;
  let failed = 0;
  return Promise.all(list.map(item => new Promise(resolve => {
    const img = new Image();
    img.onload = () => { IMG[item.key] = img; loadProgress++; resolve(); };
    img.onerror = () => { failed++; loadProgress++; resolve(); };
    img.src = item.src;
  }))).then(() => {
    if (failed > list.length * 0.5) {
      loadError = 'Many assets failed to load (' + failed + '). Use a local server or GitHub Pages, not raw file://.';
    }
  });
}

function img(key) { return IMG[key] || null; }
function drawImg(key, x, y, w, h, rot, ax, ay) {
  const i = img(key);
  if (!i) return false;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const ox = ax != null ? ax : w / 2;
  const oy = ay != null ? ay : h / 2;
  ctx.drawImage(i, -ox, -oy, w, h);
  ctx.restore();
  return true;
}
function drawImgTL(key, x, y, w, h) {
  const i = img(key);
  if (!i) return false;

  return MAPS.map((m, i) => ({ m, i })).filter(x => (x.m.difficulty || 1) === want);
}

// ─── AUDIO ───────────────────────────────────────────────────
function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='square', vol=0.08, slide=0) {
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfx(name) {
  ensureAudio();
  switch(name) {
    case 'pop': beep(800+Math.random()*400, 0.06, 'square', 0.05); break;
    case 'explode': beep(80, 0.25, 'sawtooth', 0.12, -40); break;
    case 'freeze': beep(1200, 0.15, 'sine', 0.06, 400); break;
    case 'place': beep(200, 0.1, 'triangle', 0.1); break;
    case 'upgrade': beep(400,0.08,'sine',0.08); setTimeout(()=>beep(600,0.08,'sine',0.08),80); setTimeout(()=>beep(800,0.12,'sine',0.1),160); break;
    case 'round': beep(440,0.1,'square',0.08); setTimeout(()=>beep(550,0.1,'square',0.08),100); setTimeout(()=>beep(660,0.15,'square',0.1),200); break;
    case 'gameover': beep(400,0.2,'sawtooth',0.1,-200); break;

function buildMapCache() {

  g.globalAlpha = map.terrain === 'candy' ? 0.35 : 0.5;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const key = keys[(row * 3 + col * 2) % keys.length];

    for (const z of map.waterZones) {
      const cx = z.x * W, cy = z.y * mapH;
      const rx = (z.rx || 0.1) * W, ry = (z.ry || 0.1) * mapH;
      const grd = g.createRadialGradient(cx - rx * 0.2, cy - ry * 0.2, 4, cx, cy, Math.max(rx, ry));
      grd.addColorStop(0, map.terrain === 'snow' ? '#e3f2fd' : '#4fc3f7');

      grd.addColorStop(1, map.terrain === 'snow' ? '#64b5f6' : '#01579b');

      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2;

  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.10)');
  g.fillStyle = vg;

  const pc = pathColors(map);

    // shadow
    g.strokeStyle = 'rgba(0,0,0,0.20)';
    g.lineWidth = pw + 6;
    g.beginPath();
    g.moveTo(pts[0].x + 2, pts[0].y - mapTop + 3);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x + 2, pts[i].y - mapTop + 3);
    g.stroke();
    // outer edge
    g.strokeStyle = pc.edge;
    g.lineWidth = pw;
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();
    // fill

    g.lineWidth = pw - 10;
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();

      g.lineWidth = 1;
      g.setLineDash([18, 10]);
      g.beginPath();

      g.setLineDash([]);

    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();

    // IN portal

    g.beginPath(); g.arc(sx, sy, 16, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#a5d6a7'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 11px Segoe UI'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('IN', sx, sy);

    g.fillRect(ex - 22, ey - 18, 44, 36);
    g.fillStyle = 'rgba(183,28,28,0.95)';
    g.fillRect(ex - 18, ey - 10, 36, 24);
    g.strokeStyle = '#ffcdd2'; g.lineWidth = 2;
    g.strokeRect(ex - 22, ey - 18, 44, 36);
    // battlements
    g.fillStyle = '#b71c1c';
    for (let i = 0; i < 4; i++) g.fillRect(ex - 20 + i * 11, ey - 24, 8, 8);

}
function drawDecoTo(g, type, x, y, terrain) {

  };

    case 'tree': draw('tile_tree', 64); break;
    case 'tree_star': draw('tile_tree_star', 58); break;
    case 'bush': draw('tile_bush', 40); break;
    case 'rock': draw('tile_rock1', 40); break;

      g.beginPath(); g.ellipse(x - 14, y - 6, 8, 16, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(x + 14, y - 2, 8, 14, 0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#e65100';
      g.beginPath(); g.ellipse(x, y - 30, 8, 6, 0, 0, Math.PI * 2); g.fill();
      break;
    }
    case 'candy': {
      const cols = ['#e53935', '#ffeb3b', '#ab47bc', '#29b6f6', '#ff7043'];
      g.fillStyle = cols[Math.abs(Math.floor(x * 3 + y) % cols.length)];
      g.beginPath(); g.arc(x, y, 12, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x - 3, y - 3, 3, 0, Math.PI * 2); g.fill();
      break;
    }
    case 'stump':
      draw('k133', 80);

      draw('tile_rock1', 36);
      draw('tile_rock2', 28);

    case 'lake': {

      g.beginPath(); g.ellipse(x + 14, y - 6, 8, 5, -0.2, 0, Math.PI * 2); g.fill();
      break;
    }
    case 'castle':
      draw('k180', 72);
      draw('tile_rock2', 36);
      break;
    default: draw('tile_bush', 36);
  }
}

// ─── GAME FLOW ───────────────────────────────────────────────
function startGame() {
  const d = DIFFS[selectedDiff];
  lives = d.lives; cash = d.cash; maxRounds = d.maxRounds || 40;
  round = 0; totalPopped = 0; totalSpent = 0;
  gameSpeed = 1; bloons = []; towers = []; projectiles = []; particles = [];
  floatTexts = []; firePatches = []; spriteAnims = [];
  roundWarnings = []; warnBanner = null;
  placingTower = null; selectedTower = null; roundActive = false; spawnQueue = [];
  betweenRoundTimer = 1.5;
  sidebarSide = 'right';
  gamePaths = buildPath(MAPS[selectedMap]);
  pathMetricsArr = gamePaths.map(p => pathMetrics(p));
  try { buildMapCache(); } catch (e) { console.warn('map cache', e); mapCache = null; }
  gameState = State.GAMEPLAY;
  sfx('click');
  // force sidebar refresh next frame
  if (typeof btdLastState !== 'undefined') btdLastState = null;
  if (typeof btdLastCash !== 'undefined') btdLastCash = -1;

}
function roundThreats(r) {
  const waves = ROUNDS[r] || [];
  return {
    camo: waves.some(w => w.camo || w.t === 'ddt' || (BLOON_TYPES[w.t] && BLOON_TYPES[w.t].alwaysCamo)),
    lead: waves.some(w => w.t === 'lead' || w.t === 'ddt'),
    moab: waves.some(w => BLOON_TYPES[w.t] && BLOON_TYPES[w.t].moab)

}
function pushWarning(text, color, life) {
  roundWarnings.push({ text, color: color || '#ffeb3b', life: life || 5.5, maxLife: life || 5.5 });
}
function announceThreatsForRound(r, asNext) {
  const t = roundThreats(r);
  if (!t.camo && !t.lead && !t.moab) { warnBanner = null; return; }
  const parts = [];
  if (t.moab) parts.push('MOAB-CLASS');
  if (t.camo) parts.push('CAMO / TARN');
  if (t.lead) parts.push('LEAD / BLEI');
  const prefix = asNext ? ('⚠ Nächste Runde (' + r + '): ') : ('⚠ Runde ' + r + ': ');
  const msg = prefix + parts.join(' + ') + '!';
  const color = t.lead && t.camo ? '#ff9800' : t.lead ? '#90a4ae' : '#81c784';
  pushWarning(msg, color, asNext ? 6.5 : 4.5);
  warnBanner = { text: msg, color, pulse: 0 };
  sfx('click');
}
function startRound() {
  round++;
  if (round > maxRounds) { winGame(); return; }
  const waves = ROUNDS[round] || [{t:'red',c:10,s:0.4}];
  spawnQueue = []; let time = 0;
  waves.forEach(w => {
    time += (w.d || 0);
    for (let i = 0; i < w.c; i++) {
      spawnQueue.push({ type: w.t, time: time + i * (w.s || 0.4), camo: !!w.camo, pathIdx: MAPS[selectedMap].multiPath ? (i % 2) : 0 });
    }
  });
  spawnQueue.sort((a,b) => a.time - b.time);
  spawnTimer = 0; roundActive = true; sfx('round');
  // show current-round threat toast (camo / lead this round)
  const now = roundThreats(round);
  if (now.camo || now.lead) announceThreatsForRound(round, false);
  else warnBanner = null;
}
function endRound() {
  roundActive = false;
  // BTD-like end-of-round bonus: modest early, scales slowly (cashMul by difficulty)
  const cashMul = (DIFFS[selectedDiff] && DIFFS[selectedDiff].cashMul) || 1;
  const bonus = Math.floor((50 + round * 2) * cashMul);
  cash += bonus;
  spawnFloat(W/2, 100, '+$' + bonus + ' round', '#ffd700');
  for (const t of towers) {
    if (t.special === 'income' && t.income > 0) {
      const inc = Math.floor(t.income * cashMul);
      cash += inc;
      spawnFloat(t.x, t.y - 20, '+$' + inc, '#ffeb3b');
    }
  }
  sfx('cash');
  if (round >= maxRounds) { winGame(); return; }
  betweenRoundTimer = 1.2;
  const next = round + 1;
  if (next <= maxRounds) {
    const nxt = roundThreats(next);
    if (nxt.camo || nxt.lead || nxt.moab) announceThreatsForRound(next, true);
  }
}
function winGame() {
  gameState = State.VICTORY; sfx('victory');
  if (selectedMap < MAPS.length - 1) {
    unlockedMaps[selectedMap + 1] = true;
    try { localStorage.setItem('md6_unlocked', JSON.stringify(unlockedMaps)); } catch(e) {}
  }
}
function loseGame() { gameState = State.GAME_OVER; sfx('gameover'); }

// ─── UPDATE ──────────────────────────────────────────────────
function update(rawDt) {
  animT += rawDt;
  if (gameState === State.GAMEPLAY) updateGameplay(rawDt * gameSpeed, DIFFS[selectedDiff]);
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= rawDt; p.x += (p.vx||0)*rawDt; p.y += (p.vy||0)*rawDt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.life -= rawDt; f.y += f.vy * rawDt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
  for (let i = spriteAnims.length - 1; i >= 0; i--) {
    const a = spriteAnims[i];
    a.t += rawDt;
    if (a.t >= 1 / a.fps) { a.t = 0; a.frame++; }
    if (a.frame >= a.frames) spriteAnims.splice(i, 1);
  }
  for (let i = roundWarnings.length - 1; i >= 0; i--) {
    roundWarnings[i].life -= rawDt;
    if (roundWarnings[i].life <= 0) roundWarnings.splice(i, 1);
  }
  if (warnBanner) warnBanner.pulse += rawDt;
}
function updateGameplay(t, diff) {
  if (!roundActive && bloons.filter(b => b.alive).length === 0 && autoStart && round < maxRounds) {
    betweenRoundTimer -= t / gameSpeed;
    if (betweenRoundTimer <= 0) startRound();
  }
  if (roundActive) {
    spawnTimer += t;
    while (spawnQueue.length && spawnQueue[0].time <= spawnTimer) {
      const s = spawnQueue.shift();
      spawnBloon(s.type, s.pathIdx, s.camo);
    }
    if (spawnQueue.length === 0 && bloons.filter(b => b.alive).length === 0) endRound();
  }
  for (let i = bloons.length - 1; i >= 0; i--) {
    const b = bloons[i];
    if (!b.alive) { bloons.splice(i, 1); continue; }
    const def = BLOON_TYPES[b.type];
    const pm = pathMetricsArr[b.pathIdx] || pathMetricsArr[0];
    const pts = gamePaths[b.pathIdx] || gamePaths[0];
    let speed = def.speed * 52 * diff.speedMul;
    if (b.glueTime > 0) { b.glueTime -= t; if (b.glueTime <= 0) b.glueSlow = 1; }
    if (b.frozen > 0) { b.frozen -= t; speed = 0; }
    else {
      speed *= (1 - (b.permafrost || 0));
      speed *= b.freezeSlow || 1;
      if (b.glueTime > 0) speed *= (b.glueSlow || 1);
    }
    b.progress += (speed * t) / pm.total;
    b.wobble += t * 8;
    if (def.moab) b.propAngle += t * 10;
    const pos = posOnPath(pts, pm.segs, pm.total, b.progress);
    b.x = pos.x; b.y = pos.y + Math.sin(b.wobble) * 1.5;
    if (b.progress >= 1) {
      // Leak at the BASE fort — lives lost = remaining RBE
      const loss = Math.max(1, b.rbe | 0);
      lives -= loss;
      b.alive = false;
      bloons.splice(i, 1);
      spawnParticles(b.x, b.y, '#f44336', 10, 90);
      spawnFloat(b.x, b.y - 12, '−' + loss + ' ❤', '#ff5252');
      spawnFloat(b.x, b.y + 8, 'LEAK!', '#ff8a80');
      beep(180, 0.12, 'sawtooth', 0.08, -80);
      if (lives <= 0) { lives = 0; loseGame(); }
    }
  }
  for (let i = firePatches.length - 1; i >= 0; i--) {
    const fp = firePatches[i];
    fp.life -= t; fp.dmgTimer -= t; fp.frame = (fp.frame || 0) + t * 10;
    if (fp.dmgTimer <= 0) {
      fp.dmgTimer = 0.3;
      for (const b of bloons) {
        if (b.alive && dist2(fp.x, fp.y, b.x, b.y) < fp.r * fp.r)
          damageBloon(b, 1, { projType: 'magic', canPopLead: true, canPopFrozen: true });
      }
    }
    if (fp.life <= 0) firePatches.splice(i, 1);
  }
  for (const tower of towers) {
    tower.cooldown -= t;
    if (tower.shootKick > 0) tower.shootKick = Math.max(0, tower.shootKick - t * 6);
    if (tower.shootFlash > 0) tower.shootFlash = Math.max(0, tower.shootFlash - t * 8);
    if (tower.wallCD > 0) tower.wallCD -= t;
    if (tower.special === 'income') continue;

    // Smooth aim toward current target (no floating bob)
    const aimT = getTarget(tower);
    if (aimT && towerCanAim(tower.type)) {
      const want = Math.atan2(aimT.y - tower.y, aimT.x - tower.x);
      tower.aimAngle = lerpAngle(tower.aimAngle || 0, want, Math.min(1, t * 12));
      tower.angle = tower.aimAngle;
    }

    if (tower.arctic) {
      for (const b of bloons) {

      }
    }
    if (tower.cooldown <= 0) {

    if (p.target && p.target.alive) {
      const d = dist(p.x, p.y, p.target.x, p.target.y) || 1;
      const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      p.vx = (p.target.x - p.x) / d * spd;
      p.vy = (p.target.y - p.y) / d * spd;
    }
    p.x += p.vx * t; p.y += p.vy * t;
    let hit = false;
    for (const b of bloons) {
      if (!b.alive || p.hit.includes(b)) continue;
      const br = BLOON_TYPES[b.type].radius;
      if (dist2(p.x, p.y, b.x, b.y) < (br + p.r) * (br + p.r)) {
        p.hit.push(b);
        if (p.projType === 'bomb' || p.projType === 'fireball' || (p.projType === 'water' && p.aoeRadius > 0)) {
          const ar = p.aoeRadius || 40;
          for (const b2 of bloons) {
            if (b2.alive && dist2(p.x, p.y, b2.x, b2.y) < ar * ar) damageBloon(b2, Math.max(1, p.damage), p);
          }
          spawnExplosion(p.x, p.y, ar); sfx(p.projType === 'water' ? 'pop' : 'explode'); hit = true; break;
        } else if (p.projType === 'glue') {
          const isMoab = !!BLOON_TYPES[b.type].moab;
          if (!isMoab || p.source && p.source.glueMoab) {
            b.glueSlow = Math.min(b.glueSlow || 1, p.glueSlow || 0.5);
            b.glueTime = Math.max(b.glueTime || 0, p.glueTime || 3);
          }
          if (p.damage > 0) damageBloon(b, p.damage, p);
          if (p.aoeRadius > 0) {
            for (const b2 of bloons) {
              if (!b2.alive || b2 === b) continue;
              if (dist2(p.x, p.y, b2.x, b2.y) < p.aoeRadius * p.aoeRadius) {
                if (!BLOON_TYPES[b2.type].moab || (p.source && p.source.glueMoab)) {
                  b2.glueSlow = Math.min(b2.glueSlow || 1, p.glueSlow || 0.5);
                  b2.glueTime = Math.max(b2.glueTime || 0, p.glueTime || 3);
                }
              }
            }
          }
          p.pierce--;
          if (p.pierce <= 0) { hit = true; break; }
        } else {
          damageBloon(b, p.damage, p); p.pierce--;
          if (p.pierce <= 0) { hit = true; break; }
        }
      }
    }
    if (hit || p.x < -50 || p.x > W+50 || p.y < -50 || p.y > H+50) projectiles.splice(i, 1);
  }
}

}

function drawBloon(b) {

  }

    if (barBg) ctx.drawImage(barBg, -bw/2, -size/2 - 16, bw, bh);
    else { ctx.fillStyle = '#333'; ctx.fillRect(-bw/2, -size/2 - 16, bw, bh); }
    if (barFg) ctx.drawImage(barFg, -bw/2, -size/2 - 16, bw * pct, bh);
    else { ctx.fillStyle = '#4caf50'; ctx.fillRect(-bw/2, -size/2 - 16, bw * pct, bh); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';

function drawTower(t, preview) {

  const aim = (t.aimAngle != null ? t.aimAngle : t.angle) || 0;

  // Recoil ONLY on body (pad stays fixed at tower.x/y)

  const dx = (!preview && canAim) ? -Math.cos(aim) * kickAmt * kickDist : 0;
  const dy = (!preview && canAim) ? -Math.sin(aim) * kickAmt * kickDist : 0;

  }

  ctx.ellipse(t.x, t.y + size * 0.18, size * 0.32, size * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2) Fixed base pad (does not rotate) — BTD-style platform
  const padSize = size * 0.72;
  if (!drawImg('tower_' + t.type + '_pad', t.x, t.y + 2, padSize, padSize, 0)) {
    ctx.fillStyle = 'rgba(80,70,50,0.45)';
    ctx.beginPath();
    ctx.ellipse(t.x, t.y + 2, padSize * 0.38, padSize * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Soft type aura under body

    water: '#4fc3f7', sub: '#ffee58', glue: '#9ccc65', bomb: '#90a4ae', ice: '#4fc3f7',
    farm: '#ffd54f', super: '#ef5350', tack: '#b0bec5', wizard: '#ce93d8'

    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(t.x, t.y, size * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 3) Body sprite key: attack frames while shootKick, else idle
  let key = 'tower_' + t.type;
  const drawSize = size + 8;
  if (!preview && kickAmt > 0.05) {
    // attack_0 early in kick, attack_1 as kick settles
    key = kickAmt > 0.45 ? ('tower_' + t.type + '_atk0') : ('tower_' + t.type + '_atk1');
  }

  // Rotation: body turns in place. Farm never aims. Tack spins briefly on fire.
  let rot = 0;
  if (canAim && !preview) rot = aim + Math.PI / 2;
  else if (canAim && preview) rot = -Math.PI / 2; // face up when placing
  else if (t.type === 'tack' && kickAmt > 0) rot = (1 - kickAmt) * Math.PI * 1.25;

  if (!drawImg(key, bx, by, drawSize, drawSize, rot)) {
    if (!drawImg('tower_' + t.type, bx, by, size, size, rot)) {
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(bx, by, 16, 0, Math.PI * 2); ctx.fill();
    }
  }

    const fl = t.shootFlash;
    const muzzle = (t.type === 'sniper') ? size * 0.48 : size * 0.40;
    const fx = t.x + Math.cos(aim) * muzzle;

    ctx.save();
    ctx.globalAlpha = fl;
    ctx.fillStyle = '#fffde7';
    ctx.beginPath(); ctx.arc(fx, fy, 5 + 7 * fl, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = t.type === 'super' ? '#ff1744' : t.type === 'wizard' ? '#e040fb' : '#ff9800';
    ctx.beginPath(); ctx.arc(fx, fy, 2.5 + 4 * fl, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Tack pulse ring on fire
  if (!preview && t.type === 'tack' && kickAmt > 0.2) {
    ctx.save();
    ctx.globalAlpha = kickAmt * 0.45;
    ctx.strokeStyle = '#fff59d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(t.x, t.y, size * 0.35 * (1.4 - kickAmt), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  const pt = pathTotal(t);
  if (pt > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText(pathCode(t), t.x, t.y + size * 0.48);
  }
  // Tier-5 glow
  const top = Math.max(t.paths[0], t.paths[1], t.paths[2]);
  if (top >= 5) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(animT * 4);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y, size * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

      ctx.fillText(warnBanner.text, W/2, yOff + 18);
      ctx.globalAlpha = 1;
      yOff += 42;
    }
    for (const w of roundWarnings) {
      const a = Math.min(1, w.life / 0.8) * Math.min(1, (w.maxLife - w.life) < 0.5 ? w.life / 0.5 : 1);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(W/2 - 240, yOff, 480, 28, 8); ctx.fill();
      ctx.fillStyle = w.color;
      ctx.font = 'bold 13px Segoe UI'; ctx.textAlign = 'center';
      ctx.fillText(w.text, W/2, yOff + 14);
      ctx.globalAlpha = 1;
      yOff += 32;
    }
  }

  // Bottom tower bar removed — BTD right sidebar (DOM) handles tower pick

  // Upgrade UI is DOM (#btdUpgradePanel) — BTD6 3×5 paths

  if (placingTower) {
    const def = TOWER_DEFS[placingTower];
    // Highlight water zones when placing boat/sub
    if (def.waterOnly) {
      const map = MAPS[selectedMap];
      const mapTop = 50, mapH = H - 170;
      if (map.waterZones) {
        for (const z of map.waterZones) {
          ctx.save();
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = '#29b6f6';
          ctx.beginPath();
          ctx.ellipse(z.x * W, mapTop + z.y * mapH, (z.rx || 0.1) * W, (z.ry || 0.1) * mapH, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }
    const valid = canPlace(mouse.x, mouse.y, placingTower) && mouse.y < H - 130;
    ctx.globalAlpha = 0.75;
    drawTower({ type: placingTower, x: mouse.x, y: mouse.y, range: def.range, angle: 0, aimAngle: 0, paths: [0,0,0], shootKick: 0, shootFlash: 0, spriteSize: def.spriteSize }, true);
    ctx.globalAlpha = 1;
    ctx.fillStyle = valid ? '#4caf50' : '#f44336';
    ctx.font = 'bold 14px Segoe UI'; ctx.textAlign = 'center';
    let msg = '$' + def.cost;
    if (!valid) msg += def.waterOnly && !isOnWater(mouse.x, mouse.y) ? ' — needs WATER' : ' invalid';
    ctx.fillText(msg, mouse.x, mouse.y - 40);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '12px Segoe UI';
    ctx.fillText(def.waterOnly ? 'Boat/Sub: place on water only' : 'Right-click or Esc to cancel', mouse.x, mouse.y + 48);
  }
}

const BTD_BASE = 'public/assets/ui/btd/';
const BTD_PORTRAITS = {
  dart: BTD_BASE + 'tower-dart-monkey.png',
  boomer: BTD_BASE + 'tower-boomerang-monkey.png',
  sniper: BTD_BASE + 'tower-sniper-monkey.png',

  water: BTD_BASE + 'tower-water-monkey.png',
  sub: BTD_BASE + 'tower-sub-monkey.png',
  glue: BTD_BASE + 'tower-glue-gunner.png',
  bomb: BTD_BASE + 'tower-cannon-monkey.png',
  ice: BTD_BASE + 'tower-ice.png',
  wizard: BTD_BASE + 'tower-wizard.png',
  farm: BTD_BASE + 'tower-farm.png',
  super: BTD_BASE + 'tower-super.png',
  tack: BTD_BASE + 'tower-tack-monkey.png'
};
// Maps that unlock by difficulty tab (stars) — soft filter for UI flair
let btdMapPage = 0;
let btdUiReady = false;
const MAPS_PER_PAGE = 6;

function btdEl(id) { return document.getElementById(id); }

/** Signature for when upgrade panel needs a full rebuild (not every frame). */
function btdUpgradeSignature() {
  if (!selectedTower) return '';
  const t = selectedTower;
  return towers.indexOf(t) + '|' + pathCode(t) + '|' + cash + '|' + (t.targeting || '') + '|' + sidebarSide;
}
let btdLastUpgSig = '';

function hideBtdUpgradePanel() {
  const panel = btdEl('btdUpgradePanel');
  if (!panel) return;
  panel.classList.add('hidden');
  panel.style.display = 'none';
  btdLastUpgSig = '';
}

function renderBtdUpgradePanel(force) {
  const panel = btdEl('btdUpgradePanel');
  if (!panel) return;
  if (!selectedTower || (gameState !== State.GAMEPLAY && gameState !== State.PAUSE)) {
    hideBtdUpgradePanel();
    return;
  }
  const t = selectedTower;
  const def = TOWER_DEFS[t.type];
  if (!def || !def.paths) {
    hideBtdUpgradePanel();
    return;
  }
  const sig = btdUpgradeSignature();
  // Skip full rebuild if nothing relevant changed — prevents killing button mid-click
  if (!force && sig === btdLastUpgSig && !panel.classList.contains('hidden')) {
    // still refresh sell label / afford highlight lightly via cash already in sig
    return;
  }
  btdLastUpgSig = sig;

  panel.classList.remove('hidden');
  panel.style.display = 'flex';
  panel.style.pointerEvents = 'auto';
  panel.classList.toggle('side-right', sidebarSide === 'right');
  panel.classList.toggle('side-left', sidebarSide === 'left');
  const sideW = (document.getElementById('btdSidebar') && document.getElementById('btdSidebar').offsetWidth) || 220;
  panel.style.setProperty('--side-w', sideW + 'px');

  const imgEl = btdEl('btdUpgPortrait');
  if (imgEl) imgEl.src = BTD_PORTRAITS[t.type] || ('public/assets/towers/' + (TOWER_DIRS[t.type] || t.type) + '/idle.png');
  btdEl('btdUpgName').textContent = def.name;
  btdEl('btdUpgCode').textContent = pathCode(t) + '  ·  ★' + pathTotal(t);
  const rng = t.special === 'infinite_range' ? '∞' : Math.round(t.range);
  btdEl('btdUpgStats').textContent =
    'DMG ' + t.damage + ' · R ' + rng + ' · ' + t.fireRate.toFixed(2) + 's · P ' + t.pierce +
    (t.income ? ' · $' + t.income + '/rd' : '') +
    ' · ' + (t.targeting || 'first').toUpperCase();
  btdEl('btdUpgTarget').textContent = 'TARGET: ' + (t.targeting || 'first').toUpperCase();
  btdEl('btdUpgSell').textContent = 'SELL $' + Math.floor(t.totalCost * 0.7);

  const pathsEl = btdEl('btdUpgPaths');
  pathsEl.innerHTML = '';
  const pathLabels = def.pathNames || ['Path 1', 'Path 2', 'Path 3'];
  for (let pi = 0; pi < 3; pi++) {
    const row = document.createElement('div');
    row.className = 'btd-path-row';
    const tiers = document.createElement('div');
    tiers.className = 'btd-path-tiers';
    for (let ti = 0; ti < 5; ti++) {
      const pip = document.createElement('div');
      pip.className = 'btd-tier-pip';
      if (t.paths[pi] > ti) pip.classList.add('on');
      else if (t.paths[pi] === ti && canUpgradePath(t, pi)) pip.classList.add('next');
      else pip.classList.add('locked');
      tiers.appendChild(pip);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btd-path-buy';
    btn.setAttribute('data-path', String(pi));
    const tier = t.paths[pi];
    if (tier >= 5) {
      btn.classList.add('owned-max');
      btn.disabled = true;
      btn.innerHTML = '<span class="icon">✅</span><div><div class="nm">' + pathLabels[pi] + ' MAX</div><div class="ds">Path complete (5/5)</div></div>';
    } else {
      const up = def.paths[pi][tier];
      const allowed = canUpgradePath(t, pi);
      const afford = cash >= up.cost;
      if (allowed && afford) btn.classList.add('can-buy');
      if (!afford) btn.classList.add('cant');
      btn.disabled = !allowed || !afford;
      const status = !allowed ? 'LOCKED (crosspath)' : (afford ? 'BUY T' + (tier + 1) : 'Need cash');
      btn.innerHTML =
        '<span class="icon">' + (up.icon || '⬆️') + '</span>' +
        '<div><div class="nm">' + up.name + '</div>' +
        '<div class="ds">' + up.desc + ' · ' + status + '</div></div>' +
        '<span class="pr">$' + up.cost.toLocaleString() + '</span>';
    }
    row.appendChild(tiers);
    row.appendChild(btn);
    pathsEl.appendChild(row);
  }
}

function initBtdUi() {
  if (btdUiReady) return;
  btdUiReady = true;
  // Unlock all maps so selection always works
  for (let i = 0; i < MAPS.length; i++) unlockedMaps[i] = true;
  try { localStorage.setItem('md6_unlocked', JSON.stringify(unlockedMaps)); } catch (e) {}

  const ms = btdEl('btdMapSelect');
  if (ms) ms.style.backgroundImage = 'url(' + BTD_BASE + 'home-screen-bg.png)';

  // Event delegation — survives card rebuilds
  const track = btdEl('btdMapTrack');
  if (track && !track._btdBound) {
    track._btdBound = true;
    track.addEventListener('click', (e) => {
      const card = e.target.closest('.btd-map-card');
      if (!card || card.classList.contains('locked')) {
        if (card) sfx('click');
        return;
      }
      e.preventDefault();
      e.stopPropagation();
      const idx = parseInt(card.getAttribute('data-map'), 10);
      if (isNaN(idx) || idx < 0 || idx >= MAPS.length) return;
      selectedMap = idx;
      sfx('click');
      card.style.transform = 'scale(0.94)';
      // Start game on next tick so UI can paint feedback
      setTimeout(() => {
        try {
          startGame();
        } catch (err) {
          console.error('startGame failed', err);
          alert('Could not start map: ' + (err && err.message ? err.message : err));
        }
        btdMapsBuilt = false;
        btdLastState = null;
        syncBtdUi();
      }, 80);
    });
  }

  btdEl('btdMapBack').onclick = () => { gameState = State.MAIN_MENU; sfx('click'); syncBtdUi(); };
  btdEl('btdMapPrev').onclick = () => { btdMapPage = Math.max(0, btdMapPage - 1); renderBtdMaps(); sfx('click'); };
  btdEl('btdMapNext').onclick = () => {
    const list = mapsForTab(selectedDiff);
    const pages = Math.max(1, Math.ceil(Math.max(list.length, 1) / MAPS_PER_PAGE));
    btdMapPage = Math.min(pages - 1, btdMapPage + 1); renderBtdMaps(); sfx('click');
  };
  btdEl('btdDiffBar').querySelectorAll('.btd-diff').forEach(btn => {
    btn.onclick = () => {
      selectedDiff = parseInt(btn.dataset.diff, 10);
      btdMapPage = 0;
      btdEl('btdDiffBar').querySelectorAll('.btd-diff').forEach(b => b.classList.toggle('active', b === btn));
      renderBtdMaps();
      sfx('click');
    };
  });
  btdEl('btdHeroBtn').onclick = () => sfx('click');
  btdEl('btdUpgradesBtn').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (selectedTower) renderBtdUpgradePanel(true);
    else {
      btdEl('btdSelName').textContent = 'TAP A PLACED TOWER';
      sfx('click');
    }
  };
  btdEl('btdUpgClose').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectedTower = null;
    hideBtdUpgradePanel();
    sfx('click');
  };
  btdEl('btdUpgTarget').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!selectedTower) return;
    const modes = ['first', 'last', 'strong', 'close'];
    selectedTower.targeting = modes[(modes.indexOf(selectedTower.targeting) + 1) % 4];
    renderBtdUpgradePanel(true);
    sfx('click');
  };
  btdEl('btdUpgSell').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!selectedTower) return;
    const val = Math.floor(selectedTower.totalCost * 0.7);
    cash += val;
    const idx = towers.indexOf(selectedTower);
    if (idx >= 0) towers.splice(idx, 1);
    spawnFloat(selectedTower.x, selectedTower.y, '+$' + val, '#4caf50');
    selectedTower = null;
    hideBtdUpgradePanel();
    sfx('sell');
  };
  // Event delegation for upgrade path buttons (survives partial rebuilds)
  const pathsHost = btdEl('btdUpgPaths');
  if (pathsHost && !pathsHost._btdBound) {
    pathsHost._btdBound = true;
    pathsHost.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const btn = e.target.closest('.btd-path-buy');
      if (!btn || btn.disabled) return;
      if (!selectedTower) return;
      const pi = parseInt(btn.getAttribute('data-path'), 10);
      if (isNaN(pi)) return;
      if (applyUpgrade(selectedTower, pi)) {
        btdLastUpgSig = ''; // force rebuild after successful buy
        renderBtdUpgradePanel(true);
        sfx('click');
      } else {
        sfx('click');
      }
    });
  }
  // Stop canvas from stealing mousedown that starts on the upgrade panel
  const upPanel = btdEl('btdUpgradePanel');
  if (upPanel && !upPanel._btdBound) {
    upPanel._btdBound = true;
    ['mousedown', 'mouseup', 'click', 'touchstart', 'touchend'].forEach(ev => {
      upPanel.addEventListener(ev, (e) => e.stopPropagation());
    });
  }
  btdEl('btdFfBtn').onclick = () => {
    gameSpeed = gameSpeed >= 3 ? 1 : gameSpeed + 1;
    btdEl('btdFfBtn').classList.toggle('active', gameSpeed > 1);
    btdEl('btdFfBtn').textContent = gameSpeed > 1 ? (gameSpeed + 'x') : '▶▶';
    sfx('click');
  };
  btdEl('btdAbilityBtn').onclick = () => {
    if (!roundActive && bloons.filter(b => b.alive).length === 0) startRound();
    sfx('click');
  };
  renderBtdMaps();
  renderBtdTowerGrid();
}

  return BTD_BASE + 'sunny-grove-map.png';

function mapFilterFor(i) {
  const map = MAPS[i];
  if (!map) return 'none';
  if (map.terrain === 'sand') return 'hue-rotate(-25deg) saturate(1.35) brightness(1.1)';
  if (map.terrain === 'candy') return 'hue-rotate(300deg) saturate(1.5) brightness(1.05)';
  if (map.terrain === 'snow') return 'hue-rotate(180deg) brightness(1.2) saturate(0.7)';
  if (map.terrain === 'dark') return 'hue-rotate(220deg) brightness(0.65) saturate(0.9)';
  if (map.terrain === 'lava') return 'hue-rotate(-15deg) saturate(1.5) brightness(0.8)';
  if (map.name === 'Logs') return 'hue-rotate(25deg) saturate(0.95) brightness(0.95)';
  return 'none';
}

function renderBtdMaps() {
  const track = btdEl('btdMapTrack');
  const dots = btdEl('btdMapDots');
  if (!track) return;
  for (let i = 0; i < MAPS.length; i++) unlockedMaps[i] = true;

  // Filter maps by difficulty tab (Beginner / Intermediate / Advanced / Expert)
  const list = mapsForTab(selectedDiff);
  const pages = Math.max(1, Math.ceil(Math.max(list.length, 1) / MAPS_PER_PAGE));
  btdMapPage = clamp(btdMapPage, 0, pages - 1);
  track.innerHTML = '';
  dots.innerHTML = '';

  if (list.length === 0) {
    const page = document.createElement('div');
    page.className = 'btd-map-page';
    page.style.display = 'flex';
    page.style.alignItems = 'center';
    page.style.justifyContent = 'center';
    page.innerHTML =
      '<div style="text-align:center;padding:40px;color:#fff;font-family:\'Luckiest Guy\',cursive;text-shadow:0 2px 4px #000">' +
      '<div style="font-size:28px;margin-bottom:12px">COMING SOON</div>' +
      '<div style="font-size:16px;opacity:.85">More maps for this difficulty soon!</div></div>';
    track.appendChild(page);
    const dot = document.createElement('div');
    dot.className = 'btd-dot on';
    dots.appendChild(dot);
    track.style.transform = 'translateX(0)';
    btdEl('btdDiffBar').querySelectorAll('.btd-diff').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.diff, 10) === selectedDiff);
    });
    return;
  }

  for (let p = 0; p < pages; p++) {
    const page = document.createElement('div');
    page.className = 'btd-map-page';
    for (let j = 0; j < MAPS_PER_PAGE; j++) {
      const idx = p * MAPS_PER_PAGE + j;
      if (idx >= list.length) {
        const empty = document.createElement('div');
        empty.style.visibility = 'hidden';
        page.appendChild(empty);
        continue;
      }
      const { m: map, i } = list[idx];
      const card = document.createElement('div');
      card.className = 'btd-map-card';
      card.setAttribute('data-map', String(i));
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      const diffLabel = ['', 'Beginner', 'Intermediate', 'Advanced', 'Expert'][map.difficulty] || '';
      card.innerHTML =
        '<div class="btd-map-title">' + map.name + '</div>' +
        '<img class="btd-map-thumb" alt="" draggable="false" src="' + mapThumbFor(i) + '" style="filter:' + mapFilterFor(i) + '">' +
        '<div class="btd-map-stars">' + '★'.repeat(map.difficulty) + '☆'.repeat(4 - map.difficulty) +
        ' · ' + diffLabel + ' · CLICK TO PLAY</div>';
      page.appendChild(card);
    }
    track.appendChild(page);
    const dot = document.createElement('div');
    dot.className = 'btd-dot' + (p === btdMapPage ? ' on' : '');
    dots.appendChild(dot);
  }
  track.style.transform = 'translateX(-' + (btdMapPage * 100) + '%)';
  btdEl('btdDiffBar').querySelectorAll('.btd-diff').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.diff, 10) === selectedDiff);
  });
}

function renderBtdTowerGrid() {
  const grid = btdEl('btdTowerGrid');
  if (!grid) return;
  grid.innerHTML = '';
  // Unlock progression: first 4 always, rest unlock by map difficulty / always for playability show all
  TOWER_ORDER.forEach((type, idx) => {
    const def = TOWER_DEFS[type];
    const locked = false; // all playable; locks reserved for future
    const cell = document.createElement('div');
    cell.className = 'btd-tower-cell' + (locked ? ' locked' : '') + (placingTower === type ? ' selected' : '');
    cell.dataset.type = type;
    const src = BTD_PORTRAITS[type] || ('public/assets/towers/' + type + '/idle.png');
    cell.innerHTML =
      '<img src="' + src + '" alt="' + def.name + '">' +
      (locked ? '<span class="btd-lock">🔒</span>' : '<span class="btd-price">$' + def.cost + '</span>');
    if (!locked) {
      cell.onmouseenter = () => { btdEl('btdSelName').textContent = def.name.toUpperCase(); };
      cell.onclick = () => {
        if (cash >= def.cost) {
          placingTower = type;
          selectedTower = null;
          sfx('click');
          renderBtdTowerGrid();
        } else sfx('click');
      };
      // Drag place (mouse + touch)
      const startDrag = (clientX, clientY) => {
        if (cash < def.cost) return;
        placingTower = type;
        selectedTower = null;
        if (typeof hideBtdUpgradePanel === 'function') hideBtdUpgradePanel();
        const ghost = btdEl('dragGhost');
        ghost.src = src;
        ghost.style.display = 'block';
        ghost.style.left = clientX + 'px';
        ghost.style.top = clientY + 'px';
        const onMoveClient = (cx, cy) => {
          ghost.style.left = cx + 'px';
          ghost.style.top = cy + 'px';
          const g = clientToGame(cx, cy);
          const rp = btdEl('rangePreview');
          const def2 = TOWER_DEFS[type];
          const r = def2.range * scale;
          const sx = canvas.getBoundingClientRect().left + ox + g.x * scale;
          const sy = canvas.getBoundingClientRect().top + oy + g.y * scale;
          rp.style.display = 'block';
          rp.style.width = (r * 2) + 'px';
          rp.style.height = (r * 2) + 'px';
          rp.style.left = sx + 'px';
          rp.style.top = sy + 'px';
          mouse.x = g.x; mouse.y = g.y;
          updateSidebarDock();
          const ok = canPlace(g.x, g.y, type) && g.y < H - 40;
          rp.style.borderColor = ok ? 'rgba(76,175,80,.7)' : 'rgba(244,67,54,.7)';
          rp.style.background = ok ? 'rgba(76,175,80,.12)' : 'rgba(244,67,54,.12)';
        };
        const finish = (cx, cy) => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
          ghost.style.display = 'none';
          btdEl('rangePreview').style.display = 'none';
          const g = clientToGame(cx, cy);
          mouse.x = g.x; mouse.y = g.y;
          updateSidebarDock();
          if (placingTower === type && canPlace(g.x, g.y, type) && g.y > 55 && g.y < H - 20) {
            if (cash >= def.cost) {
              cash -= def.cost; totalSpent += def.cost;
              towers.push(createTower(type, g.x, g.y));
              sfx('place');
              if (cash < def.cost) placingTower = null;
            }
          }
          updateSidebarDock();
          renderBtdTowerGrid();
        };
        const onMouseMove = (ev) => onMoveClient(ev.clientX, ev.clientY);
        const onMouseUp = (ev) => finish(ev.clientX, ev.clientY);
        const onTouchMove = (ev) => {
          if (!ev.changedTouches.length) return;
          ev.preventDefault();
          onMoveClient(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY);
        };
        const onTouchEnd = (ev) => {
          if (!ev.changedTouches.length) return;
          finish(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd);
        renderBtdTowerGrid();
      };
      cell.onmousedown = (e) => {
        if (e.button !== 0) return;
        startDrag(e.clientX, e.clientY);
      };
      cell.addEventListener('touchstart', (e) => {
        if (!e.changedTouches.length) return;
        e.preventDefault();
        e.stopPropagation();
        // tap selects for placement; drag moves
        const t0 = e.changedTouches[0];
        if (cash >= def.cost) {
          placingTower = type;
          selectedTower = null;
          btdEl('btdSelName').textContent = def.name.toUpperCase();
        }
        startDrag(t0.clientX, t0.clientY);
      }, { passive: false });
    }
    if (cash < def.cost) cell.classList.add('cant-afford');
    grid.appendChild(cell);
  });
  if (placingTower && TOWER_DEFS[placingTower]) {
    btdEl('btdSelName').textContent = TOWER_DEFS[placingTower].name.toUpperCase();
  } else if (selectedTower) {
    btdEl('btdSelName').textContent = TOWER_DEFS[selectedTower.type].name.toUpperCase();
  }
}

let btdLastState = null;
let btdLastCash = -1;
let btdLastPlace = null;
let btdLastSpeed = -1;
let btdMapsBuilt = false;

function syncBtdUi() {
  initBtdUi();
  const mapEl = btdEl('btdMapSelect');
  const sideEl = btdEl('btdSidebar');
  if (!mapEl || !sideEl) return;
  const showMap = gameState === State.MAP_SELECT || gameState === State.DIFFICULTY_SELECT;
  const showSide = gameState === State.GAMEPLAY || gameState === State.PAUSE;

  // Explicit show/hide (class + style) so menu cannot soft-lock as invisible
  if (showMap) {
    mapEl.classList.remove('hidden');
    mapEl.style.display = 'flex';
    mapEl.style.pointerEvents = 'auto';
  } else {
    mapEl.classList.add('hidden');
    mapEl.style.display = 'none';
  }
  if (showSide) {
    sideEl.classList.remove('hidden');
    sideEl.style.display = 'flex';
    sideEl.style.pointerEvents = 'auto';
    applySidebarDock();
  } else {
    sideEl.classList.add('hidden');
    sideEl.style.display = 'none';
  }
  // Upgrade panel: only rebuild when signature changes (cash/paths/selection) — NOT every frame
  if (showSide && selectedTower) {
    renderBtdUpgradePanel(false);
  } else {
    hideBtdUpgradePanel();
  }

  // Rebuild map cards only when entering map select
  if (showMap && (btdLastState !== State.MAP_SELECT && btdLastState !== State.DIFFICULTY_SELECT || !btdMapsBuilt)) {
    renderBtdMaps();
    btdMapsBuilt = true;
  }
  if (!showMap) btdMapsBuilt = false;

  if (showSide) {
    if (btdLastCash !== cash || btdLastPlace !== placingTower || btdLastState !== gameState) {
      renderBtdTowerGrid();
      btdLastCash = cash;
      btdLastPlace = placingTower;
    }
    if (btdLastSpeed !== gameSpeed) {
      btdEl('btdFfBtn').classList.toggle('active', gameSpeed > 1);
      btdEl('btdFfBtn').textContent = gameSpeed > 1 ? (gameSpeed + 'x') : '▶▶';
      btdLastSpeed = gameSpeed;
    }
  }
  btdLastState = gameState;
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  switch (gameState) {
    case State.LOADING: drawLoading(); break;
    case State.MAIN_MENU: drawMainMenu(); break;
    case State.MAP_SELECT:
    case State.DIFFICULTY_SELECT:
      // BTD DOM map UI handles this screen
      ctx.fillStyle = '#1a3d15';
      ctx.fillRect(0, 0, W, H);
      break;
    case State.GAMEPLAY:
    case State.PAUSE:
    case State.GAME_OVER:
    case State.VICTORY:
      drawMap();
      for (const fp of firePatches) {
        const fi = Math.floor(fp.frame) % 6;
        drawImg('fx_fire_' + fi, fp.x, fp.y, fp.r * 2.5, fp.r * 2.5);
      }
      for (const t of towers) drawTower(t);
      for (const b of bloons) if (b.alive) drawBloon(b);
      for (const p of projectiles) drawProjectile(p);
      drawSpriteAnims();
      drawParticles();
      drawHUD();
      if (gameState === State.PAUSE) drawPause();
      if (gameState === State.GAME_OVER) drawGameOver();
      if (gameState === State.VICTORY) drawVictory();
      break;
  }
  syncBtdUi();
}

function loop(now) {
  dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  handleClick();
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ─── BOOT ────────────────────────────────────────────────────
lastTime = performance.now();
requestAnimationFrame(loop);
loadAssets().then(() => {
  gameState = State.MAIN_MENU;
  initBtdUi();
  syncBtdUi();
}).catch(err => {
  loadError = String(err);
  gameState = State.MAIN_MENU;
  initBtdUi();
  syncBtdUi();
});

})();
</script>
