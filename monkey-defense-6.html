function buildAssetList() {
  const list = [];
  const add = (key, src) => list.push({ key, src: ASSET_BASE + src });
  Object.entries(TOWER_SPRITE).forEach(([k, v]) => add('tower_' + k, v));
  Object.entries(TOWER_IDLE2).forEach(([k, arr]) => {
    arr.forEach((v, i) => add('tower_' + k + '_f' + i, v));
  });
  // Kenney machine overlays (CC0) used as bomb/tack sources
  add('kenney_cannon', 'towers/bomb_shooter/kenney_cannon.png');
  add('kenney_multi', 'towers/tack_shooter/kenney_multi.png');
  WIZARD_FRAMES.forEach((v, i) => add('wizard_idle_' + i, v));
  WIZARD_ATTACK.forEach((v, i) => add('wizard_atk_' + i, v));
  Object.entries(BLOON_SPRITE).forEach(([k, v]) => add('bloon_' + k, v));
  Object.entries(PROJ_SPRITE).forEach(([k, v]) => add('proj_' + k, v));
  Object.entries(TILE_KEYS).forEach(([k, v]) => add('tile_' + k, v));
  Object.entries(UI_KEYS).forEach(([k, v]) => add('ui_' + k, v));
  for (let i = 0; i < 8; i++) add('fx_explosion_' + i, `effects/explosion/explosion_0${i}.png`);
  for (let i = 0; i < 6; i++) add('fx_freeze_' + i, `effects/freeze/freeze_0${i}.png`);
  for (let i = 0; i < 6; i++) add('fx_fire_' + i, `effects/fire/fire_0${i}.png`);
  for (let i = 0; i < 6; i++) add('fx_magic_' + i, `effects/magic/magic_0${i}.png`);
  for (let i = 0; i < 6; i++) add('fx_pop_' + i, `bloons/pop_animation/pop_0${i}.png`);
  // Kenney extras for map variety
  [1,2,3,7,10,22,24,25,37,69,100,130,131,132,133,134,135,136,137,154,180,181,203,204,205,206,249,250,270,271,291,292].forEach(n => {
    const id = String(n).padStart(3, '0');
    add('k' + id, `kenney/PNG/Default size/towerDefense_tile${id}.png`);
  });
  return list;
}

function loadAssets() {
  const list = buildAssetList();
  loadTotal = Math.max(1, list.length);
  loadProgress = 0;
  let failed = 0;
  return Promise.all(list.map(item => new Promise(resolve => {
    const img = new Image();
    img.onload = () => { IMG[item.key] = img; loadProgress++; resolve(); };
    img.onerror = () => { failed++; loadProgress++; resolve(); };
    img.src = item.src;
  }))).then(() => {
    if (failed > list.length * 0.5) {
      loadError = 'Many assets failed to load (' + failed + '). Use a local server or GitHub Pages, not raw file://.';
    }
  });
}

function img(key) { return IMG[key] || null; }
function drawImg(key, x, y, w, h, rot, ax, ay) {
  const i = img(key);
  if (!i) return false;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const ox = ax != null ? ax : w / 2;
  const oy = ay != null ? ay : h / 2;
  ctx.drawImage(i, -ox, -oy, w, h);
  ctx.restore();
  return true;
}
function drawImgTL(key, x, y, w, h) {
  const i = img(key);
  if (!i) return false;
  ctx.drawImage(i, x, y, w, h);
  return true;
}

function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='square', vol=0.08, slide=0) {
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfx(name) {
  ensureAudio();
  switch(name) {
    case 'pop': beep(800+Math.random()*400, 0.06, 'square', 0.05); break;
    case 'explode': beep(80, 0.25, 'sawtooth', 0.12, -40); break;
    case 'freeze': beep(1200, 0.15, 'sine', 0.06, 400); break;

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}
function dist2(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;}

function buildPath(map) {
  const paths = [];
  // Keep playfield clear of HUD: top bar 50px, bottom panel 120px, side margins 16px
  const mapTop = 50, mapH = H - 170;
  const marginX = 16, usableW = W - marginX * 2;
  const toWorld = (p) => ({
    x: marginX + clamp(p.x, 0, 1) * usableW,
    y: mapTop + clamp(p.y, 0, 1) * mapH
  });
  if (map.multiPath) {
    paths.push(map.path.map(toWorld));
    paths.push(map.path2.map(toWorld));
  } else {
    paths.push(map.path.map(toWorld));
  }
  return paths;
}
function pathMetrics(pts) {
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const l = dist(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    segs.push(l); total += l;
  }
  return { segs, total };
}
function posOnPath(pts, segs, total, t) {
  t = clamp(t, 0, 1); let d = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i] || i === segs.length - 1) {
      const f = segs[i] > 0 ? d / segs[i] : 0;
      return { x: lerp(pts[i].x, pts[i+1].x, f), y: lerp(pts[i].y, pts[i+1].y, f) };
    }
    d -= segs[i];
  }
  return { x: pts[pts.length-1].x, y: pts[pts.length-1].y };
}
function distToPath(px, py, pts) {
  let minD = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax=pts[i].x, ay=pts[i].y, bx=pts[i+1].x, by=pts[i+1].y;
    const abx=bx-ax, aby=by-ay;
    const t = clamp(((px-ax)*abx+(py-ay)*aby)/(abx*abx+aby*aby+0.001), 0, 1);
    const d = dist(px, py, ax+abx*t, ay+aby*t);
    if (d < minD) minD = d;
  }
  return minD;
}

function damageBloon(b, dmg, source) {
  if (!b.alive) return false;
  const def = BLOON_TYPES[b.type];
  if (source) {
    if (def.immune) {
      if (def.immune.includes('bomb') && source.projType === 'bomb') return false;
      if (def.immune.includes('magic') && (source.projType === 'magic' || source.projType === 'laser' || source.projType === 'plasma')) return false;
      if (def.immune.includes('sharp') && !source.canPopLead && ['dart','tack','spike','sniper'].includes(source.projType)) return false;
      if (def.immune.includes('freeze') && source.projType === 'freeze') return false;
    }
    if (b.frozen > 0 && !source.canPopFrozen && source.projType !== 'freeze') return false;
    if (b.camo && !source.canSeeCamo) return false;
  }
  let actual = dmg;
  if (def.moab && source && source.moabMul) actual *= source.moabMul;
  b.hp -= actual;
  if (b.hp <= 0) { popBloon(b); return true; }
  return false;
}
function popBloon(b) {
  if (!b.alive) return;
  b.alive = false;
  const def = BLOON_TYPES[b.type];
  cash += def.cash; totalPopped++;
  if (def.moab) { spawnExplosion(b.x, b.y, def.radius); sfx('explode'); }
  else { spawnPop(b.x, b.y); sfx('pop'); }
  spawnFloat(b.x, b.y - 10, '+$' + def.cash, '#ffd700');
  const children = def.children;
  if (children && children.length) {
    children.forEach((ct, i) => {
      const child = createBloon(ct, b.pathIdx, Math.max(0, b.progress - i * 0.008), b.camo);
      if (child) { if (b.permafrost > 0) child.permafrost = b.permafrost; bloons.push(child); }
    });
  }

  const def = BLOON_TYPES[b.type];
  if (def.moab) return;
  if (def.immune && def.immune.includes('freeze')) return;
  b.frozen = Math.max(b.frozen, duration);
  if (permafrost) b.permafrost = 0.5;
  if (arctic) b.freezeSlow = 0.5;
}

  const c = up.changes;
  if (c.pierce) tower.pierce += c.pierce;
  if (c.damage) tower.damage += c.damage;
  if (c.fireRate) tower.fireRate = Math.max(0.04, tower.fireRate + c.fireRate);

  if (c.moabMul) tower.moabMul = c.moabMul;

function getTarget(tower) {

    if (b.camo && !tower.canSeeCamo) continue;
    const d2v = dist2(tower.x, tower.y, b.x, b.y);
    if (!inf && d2v > r2) continue;
    const d = Math.sqrt(d2v);
    switch (tower.targeting) {
      case 'first': if (b.progress > bestVal) { bestVal = b.progress; best = b; } break;
      case 'last': if (b.progress < worstVal) { worstVal = b.progress; best = b; } break;
      case 'strong':

    projectiles.push(p);
  }
  if (tower.wallOfFire && tower.wallCD <= 0) {
    tower.wallCD = 4;
    firePatches.push({ x: target.x, y: target.y, life: 5, maxLife: 5, r: 30, dmgTimer: 0, frame: 0 });
  }
}

function canPlace(x, y) {
  if (y < 55 || y > H - 145 || x < 20 || x > W - 20) return false;
  for (const p of gamePaths) if (distToPath(x, y, p) < 32) return false;
  for (const t of towers) if (dist(x, y, t.x, t.y) < 40) return false;
  const map = MAPS[selectedMap];
  if (map.name === 'Tree Stump' && dist(x, y, W*0.5, (H-140)*0.5+50) < 55) return false;
  if (map.name === 'Frozen Lake' && dist(x, y, W*0.5, (H-140)*0.4+50) < 70) return false;
  return true;
}

// ─── MAP TILE CACHE (clean Kenney-style flat terrain) ────────
function terrainTileKeys(terrain) {
  switch (terrain) {
    case 'snow': return ['tile_snow', 'tile_snow_alt'];
    case 'lava': return ['tile_lava_base', 'tile_lava'];
    case 'dark': return ['tile_dark', 'tile_dark_alt'];
    default: return ['tile_grass', 'tile_grass_alt'];
  }
}
function terrainFillColor(terrain) {
  switch (terrain) {
    case 'snow': return '#dce9f5';
    case 'lava': return '#3a201c';
    case 'dark': return '#2a2e48';
    default: return '#5cb04a';
  }
}
function pathColors(terrain) {
  switch (terrain) {
    case 'snow': return { edge: '#8aa0b8', fill: '#c5d4e4', dash: 'rgba(255,255,255,0.35)' };
    case 'lava': return { edge: '#4a2010', fill: '#6b3a28', dash: 'rgba(255,140,60,0.25)' };
    case 'dark': return { edge: '#1a1a2e', fill: '#3d4260', dash: 'rgba(180,160,255,0.2)' };
    default: return { edge: '#8b6914', fill: '#d2b48c', dash: 'rgba(255,255,255,0.22)' };
  }
}
function buildMapCache() {
  const map = MAPS[selectedMap];
  const mapTop = 50, mapH = H - 170;
  const TS = 64;
  const cols = Math.ceil(W / TS) + 1;
  const rows = Math.ceil(mapH / TS) + 1;
  const off = document.createElement('canvas');
  off.width = W; off.height = mapH + 20;
  const g = off.getContext('2d');
  // solid base (no seams)
  g.fillStyle = terrainFillColor(map.terrain);
  g.fillRect(0, 0, off.width, off.height);
  // soft tile pattern (low contrast, clean)
  const keys = terrainTileKeys(map.terrain);
  g.globalAlpha = 0.55;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const key = keys[(row * 3 + col * 2) % keys.length];
      const im = img(key) || img('tile_grass');
      if (im) g.drawImage(im, col * TS, row * TS, TS, TS);
    }
  }
  g.globalAlpha = 1;
  // soft vignette for polish
  const vg = g.createRadialGradient(W/2, mapH/2, mapH*0.2, W/2, mapH/2, mapH*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.12)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, mapH);

  const pc = pathColors(map.terrain);
  // clean path ribbons
  for (const pts of gamePaths) {
    // shadow
    g.strokeStyle = 'rgba(0,0,0,0.18)';
    g.lineWidth = 44; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(pts[0].x + 2, pts[0].y - mapTop + 3);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x + 2, pts[i].y - mapTop + 3);
    g.stroke();
    // outer edge
    g.strokeStyle = pc.edge;
    g.lineWidth = 40;
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();
    // fill
    g.strokeStyle = pc.fill;
    g.lineWidth = 30;
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();
    // center dashes
    g.strokeStyle = pc.dash;
    g.lineWidth = 2;
    g.setLineDash([10, 12]);
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y - mapTop);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - mapTop);
    g.stroke();
    g.setLineDash([]);
  }
  // decorations (only off-path)
  for (const d of map.decorations) {
    const x = d.x * W, y = d.y * mapH;
    let onPath = false;
    for (const pts of gamePaths) {
      if (distToPath(x, y + mapTop, pts) < 40) { onPath = true; break; }
    }
    if (!onPath || d.type === 'stump' || d.type === 'lake' || d.type === 'castle') {
      drawDecoTo(g, d.type, x, y, map.terrain);
    }
  }
  // entrance portal + exit fort (bloons die / cost lives only at the fort)
  for (const pts of gamePaths) {
    const sx = pts[0].x, sy = pts[0].y - mapTop;
    const ex = pts[pts.length-1].x, ey = pts[pts.length-1].y - mapTop;
    // IN portal
    g.fillStyle = 'rgba(46,125,50,0.95)';
    g.beginPath(); g.arc(sx, sy, 16, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#a5d6a7'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 11px Segoe UI'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('IN', sx, sy);
    // EXIT fort / base — clear sink so leaks feel intentional
    g.fillStyle = 'rgba(60,20,20,0.92)';
    g.fillRect(ex - 22, ey - 18, 44, 36);
    g.fillStyle = 'rgba(183,28,28,0.95)';
    g.fillRect(ex - 18, ey - 10, 36, 24);
    g.strokeStyle = '#ffcdd2'; g.lineWidth = 2;
    g.strokeRect(ex - 22, ey - 18, 44, 36);
    // battlements
    g.fillStyle = '#b71c1c';
    for (let i = 0; i < 4; i++) g.fillRect(ex - 20 + i * 11, ey - 24, 8, 8);
    g.fillStyle = '#fff'; g.font = 'bold 10px Segoe UI';
    g.fillText('BASE', ex, ey + 2);
    g.font = 'bold 9px Segoe UI'; g.fillStyle = '#ffcdd2';
    g.fillText('♥', ex, ey - 8);
  }
  mapCache = off;
}
function drawDecoTo(g, type, x, y, terrain) {
  const draw = (key, s) => {
    const im = img(key);
    if (im) g.drawImage(im, x - s/2, y - s/2, s, s);
  };
  switch (type) {
    case 'tree': draw('tile_tree', 64); break;
    case 'tree_star': draw('tile_tree_star', 58); break;
    case 'bush': draw('tile_bush', 40); break;
    case 'rock': draw('tile_rock1', 40); break;
    case 'stump':
      draw('k133', 80);
      break;
    case 'lake': {
      const im = img('tile_water');
      if (im) {
        g.globalAlpha = 0.85;
        g.drawImage(im, x - 90, y - 55, 180, 110);
        g.globalAlpha = 1;
      }
      g.strokeStyle = 'rgba(255,255,255,0.25)';
      g.lineWidth = 2;
      g.beginPath(); g.ellipse(x, y, 88, 52, 0, 0, Math.PI*2); g.stroke();
      break;
    }
    case 'castle':
      draw('k180', 72);
      draw('tile_rock2', 36);
      break;
    default: draw('tile_bush', 36);
  }
}

// ─── GAME FLOW ───────────────────────────────────────────────
function startGame() {
  const d = DIFFS[selectedDiff];
  lives = d.lives; cash = d.cash; round = 0; totalPopped = 0; totalSpent = 0;
  gameSpeed = 1; bloons = []; towers = []; projectiles = []; particles = [];
  floatTexts = []; firePatches = []; spriteAnims = [];
  roundWarnings = []; warnBanner = null;
  placingTower = null; selectedTower = null; roundActive = false; spawnQueue = [];
  betweenRoundTimer = 1.5;
  gamePaths = buildPath(MAPS[selectedMap]);
  pathMetricsArr = gamePaths.map(p => pathMetrics(p));
  buildMapCache();
  gameState = State.GAMEPLAY;
  sfx('click');
}
function roundThreats(r) {
  const waves = ROUNDS[r] || [];
  return {
    camo: waves.some(w => w.camo),
    lead: waves.some(w => w.t === 'lead')
  };
}
function pushWarning(text, color, life) {
  roundWarnings.push({ text, color: color || '#ffeb3b', life: life || 5.5, maxLife: life || 5.5 });
}
function announceThreatsForRound(r, asNext) {
  const t = roundThreats(r);
  if (!t.camo && !t.lead) { warnBanner = null; return; }
  const parts = [];
  if (t.camo) parts.push('CAMO / TARN');
  if (t.lead) parts.push('LEAD / BLEI');
  const prefix = asNext ? ('⚠ Nächste Runde (' + r + '): ') : ('⚠ Runde ' + r + ': ');
  const msg = prefix + parts.join(' + ') + '!';
  const color = t.lead && t.camo ? '#ff9800' : t.lead ? '#90a4ae' : '#81c784';
  pushWarning(msg, color, asNext ? 6.5 : 4.5);
  warnBanner = { text: msg, color, pulse: 0 };
  sfx('click');
}
function startRound() {
  round++;
  if (round > maxRounds) { winGame(); return; }
  const waves = ROUNDS[round] || [{t:'red',c:10,s:0.4}];
  spawnQueue = []; let time = 0;
  waves.forEach(w => {
    time += (w.d || 0);
    for (let i = 0; i < w.c; i++) {
      spawnQueue.push({ type: w.t, time: time + i * (w.s || 0.4), camo: !!w.camo, pathIdx: MAPS[selectedMap].multiPath ? (i % 2) : 0 });
    }
  });
  spawnQueue.sort((a,b) => a.time - b.time);
  spawnTimer = 0; roundActive = true; sfx('round');
  // show current-round threat toast (camo / lead this round)
  const now = roundThreats(round);
  if (now.camo || now.lead) announceThreatsForRound(round, false);
  else warnBanner = null;
}
function endRound() {
  roundActive = false;
  const bonus = 100 + round;
  cash += bonus;
  spawnFloat(W/2, 100, '+$' + bonus + ' round income', '#ffd700');
  for (const t of towers) {
    if (t.special === 'income' && t.income > 0) {
      cash += t.income;
      spawnFloat(t.x, t.y - 20, '+$' + t.income, '#ffeb3b');
    }
  }
  sfx('cash');
  if (round >= maxRounds) { winGame(); return; }
  betweenRoundTimer = 1.0;
  // ONE ROUND AHEAD: warn about camo / lead in the upcoming round
  const next = round + 1;
  if (next <= maxRounds) {
    const nxt = roundThreats(next);
    if (nxt.camo || nxt.lead) announceThreatsForRound(next, true);
  }
}
function winGame() {
  gameState = State.VICTORY; sfx('victory');
  if (selectedMap < 4) {
    unlockedMaps[selectedMap + 1] = true;
    try { localStorage.setItem('md6_unlocked', JSON.stringify(unlockedMaps)); } catch(e) {}
  }
}
function loseGame() { gameState = State.GAME_OVER; sfx('gameover'); }

// ─── UPDATE ──────────────────────────────────────────────────
function update(rawDt) {
  animT += rawDt;
  if (gameState === State.GAMEPLAY) updateGameplay(rawDt * gameSpeed, DIFFS[selectedDiff]);
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= rawDt; p.x += (p.vx||0)*rawDt; p.y += (p.vy||0)*rawDt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.life -= rawDt; f.y += f.vy * rawDt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
  for (let i = spriteAnims.length - 1; i >= 0; i--) {
    const a = spriteAnims[i];
    a.t += rawDt;
    if (a.t >= 1 / a.fps) { a.t = 0; a.frame++; }
    if (a.frame >= a.frames) spriteAnims.splice(i, 1);
  }
  for (let i = roundWarnings.length - 1; i >= 0; i--) {
    roundWarnings[i].life -= rawDt;
    if (roundWarnings[i].life <= 0) roundWarnings.splice(i, 1);
  }
  if (warnBanner) warnBanner.pulse += rawDt;
}
function updateGameplay(t, diff) {
  if (!roundActive && bloons.filter(b => b.alive).length === 0 && autoStart && round < maxRounds) {
    betweenRoundTimer -= t / gameSpeed;
    if (betweenRoundTimer <= 0) startRound();
  }
  if (roundActive) {
    spawnTimer += t;
    while (spawnQueue.length && spawnQueue[0].time <= spawnTimer) {
      const s = spawnQueue.shift();
      spawnBloon(s.type, s.pathIdx, s.camo);
    }
    if (spawnQueue.length === 0 && bloons.filter(b => b.alive).length === 0) endRound();
  }
  for (let i = bloons.length - 1; i >= 0; i--) {
    const b = bloons[i];
    if (!b.alive) { bloons.splice(i, 1); continue; }
    const def = BLOON_TYPES[b.type];
    const pm = pathMetricsArr[b.pathIdx] || pathMetricsArr[0];
    const pts = gamePaths[b.pathIdx] || gamePaths[0];
    let speed = def.speed * 55 * diff.speedMul;
    if (b.frozen > 0) { b.frozen -= t; speed = 0; }
    else { speed *= (1 - (b.permafrost || 0)); speed *= b.freezeSlow || 1; }
    b.progress += (speed * t) / pm.total;
    b.wobble += t * 8;
    if (def.moab) b.propAngle += t * 10;
    const pos = posOnPath(pts, pm.segs, pm.total, b.progress);
    b.x = pos.x; b.y = pos.y + Math.sin(b.wobble) * 1.5;
    if (b.progress >= 1) {
      // Leak at the BASE fort — lives lost = remaining RBE
      const loss = Math.max(1, b.rbe | 0);
      lives -= loss;
      b.alive = false;
      bloons.splice(i, 1);
      spawnParticles(b.x, b.y, '#f44336', 10, 90);
      spawnFloat(b.x, b.y - 12, '−' + loss + ' ❤', '#ff5252');
      spawnFloat(b.x, b.y + 8, 'LEAK!', '#ff8a80');
      beep(180, 0.12, 'sawtooth', 0.08, -80);
      if (lives <= 0) { lives = 0; loseGame(); }
    }
  }
  for (let i = firePatches.length - 1; i >= 0; i--) {
    const fp = firePatches[i];
    fp.life -= t; fp.dmgTimer -= t; fp.frame = (fp.frame || 0) + t * 10;
    if (fp.dmgTimer <= 0) {
      fp.dmgTimer = 0.3;
      for (const b of bloons) {
        if (b.alive && dist2(fp.x, fp.y, b.x, b.y) < fp.r * fp.r)
          damageBloon(b, 1, { projType: 'magic', canPopLead: true, canPopFrozen: true });
      }
    }
    if (fp.life <= 0) firePatches.splice(i, 1);
  }
  for (const tower of towers) {
    tower.bob += t * 2; tower.cooldown -= t;
    if (tower.wallCD > 0) tower.wallCD -= t;
    if (tower.special === 'income') continue;
    if (tower.arctic) {
      for (const b of bloons) {
        if (b.alive && dist2(tower.x, tower.y, b.x, b.y) <= tower.range * tower.range) b.freezeSlow = 0.5;
      }
    }
    if (tower.cooldown <= 0) {
      if (tower.projType === 'freeze') {
        let any = false;
        for (const b of bloons) {
          if (b.alive && dist2(tower.x, tower.y, b.x, b.y) <= tower.range * tower.range) { any = true; break; }
        }
        if (any) { fireTower(tower, bloons[0]); tower.cooldown = tower.fireRate; }
      } else {
        const target = getTarget(tower);
        if (target) { fireTower(tower, target); tower.cooldown = tower.fireRate; }
      }
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= t;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }
    if (p.target && p.target.alive) {
      const d = dist(p.x, p.y, p.target.x, p.target.y) || 1;
      const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      p.vx = (p.target.x - p.x) / d * spd;
      p.vy = (p.target.y - p.y) / d * spd;
    }
    p.x += p.vx * t; p.y += p.vy * t;
    let hit = false;
    for (const b of bloons) {
      if (!b.alive || p.hit.includes(b)) continue;
      const br = BLOON_TYPES[b.type].radius;
      if (dist2(p.x, p.y, b.x, b.y) < (br + p.r) * (br + p.r)) {
        p.hit.push(b);
        if (p.projType === 'bomb' || p.projType === 'fireball') {
          const ar = p.aoeRadius || 40;
          for (const b2 of bloons) {
            if (b2.alive && dist2(p.x, p.y, b2.x, b2.y) < ar * ar) damageBloon(b2, p.damage, p);
          }
          spawnExplosion(p.x, p.y, ar); sfx('explode'); hit = true; break;
        } else {
          damageBloon(b, p.damage, p); p.pierce--;
          if (p.pierce <= 0) { hit = true; break; }
        }
      }
    }
    if (hit || p.x < -50 || p.x > W+50 || p.y < -50 || p.y > H+50) projectiles.splice(i, 1);
  }
}

// ─── INPUT ───────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const g = toGame(e.clientX - r.left, e.clientY - r.top);
  mouse.x = g.x; mouse.y = g.y;
});
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const r = canvas.getBoundingClientRect();
  const g = toGame(e.clientX - r.left, e.clientY - r.top);
  mouse.x = g.x; mouse.y = g.y; mouse.down = true;
  if (e.button === 2) {
    // Right-click cancels placement / deselects tower
    if (placingTower) { placingTower = null; sfx('click'); }
    else if (selectedTower) { selectedTower = null; sfx('click'); }
    return;
  }
  mouse.clicked = true;
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (gameState === State.GAMEPLAY) { gameState = State.PAUSE; sfx('click'); }
    else if (gameState === State.PAUSE) gameState = State.GAMEPLAY;
    else if (placingTower) placingTower = null;
  }
  if (e.key === ' ' && gameState === State.GAMEPLAY) {
    e.preventDefault();
    if (!roundActive && bloons.filter(b=>b.alive).length === 0) startRound();
  }
  if ((e.key === '1' || e.key === '2' || e.key === '3') && gameState === State.GAMEPLAY) gameSpeed = parseInt(e.key);
});
function hitBtn(x, y, w, h) {
  return mouse.x >= x && mouse.x <= x+w && mouse.y >= y && mouse.y <= y+h;
}
function handleClick() {
  if (!mouse.clicked) return;
  mouse.clicked = false;
  const mx = mouse.x, my = mouse.y;
  if (gameState === State.LOADING) return;
  if (gameState === State.MAIN_MENU) {
    if (hitBtn(W/2-120, H/2+20, 240, 60)) { gameState = State.MAP_SELECT; sfx('click'); }
    if (hitBtn(W-80, 20, 50, 40)) { muted = !muted; sfx('click'); }
    return;
  }
  if (gameState === State.MAP_SELECT) {
    if (hitBtn(40, H-70, 120, 40)) { gameState = State.MAIN_MENU; sfx('click'); return; }
    for (let i = 0; i < MAPS.length; i++) {
      const col = i % 3, row = Math.floor(i / 3);
      // Must match drawMapSelect layout
      const x = 140 + col * 340, y = 120 + row * 250;
      if (hitBtn(x, y, 300, 210) && unlockedMaps[i]) {
        selectedMap = i; gameState = State.DIFFICULTY_SELECT; sfx('click');
      }
    }
    return;
  }
  if (gameState === State.DIFFICULTY_SELECT) {
    if (hitBtn(40, H-70, 120, 40)) { gameState = State.MAP_SELECT; sfx('click'); return; }
    for (let i = 0; i < 4; i++) {
      if (hitBtn(180 + i * 240, 280, 200, 160)) { selectedDiff = i; startGame(); }
    }
    return;
  }
  if (gameState === State.PAUSE) {
    if (hitBtn(W/2-100, H/2-40, 200, 45)) { gameState = State.GAMEPLAY; sfx('click'); }
    if (hitBtn(W/2-100, H/2+20, 200, 45)) { startGame(); sfx('click'); }
    if (hitBtn(W/2-100, H/2+80, 200, 45)) { gameState = State.MAIN_MENU; sfx('click'); }
    return;
  }
  if (gameState === State.GAME_OVER || gameState === State.VICTORY) {
    if (hitBtn(W/2-100, H/2+80, 200, 45)) { startGame(); sfx('click'); }
    if (hitBtn(W/2-100, H/2+140, 200, 45)) { gameState = State.MAIN_MENU; sfx('click'); }
    return;
  }
  if (gameState === State.GAMEPLAY) {
    if (hitBtn(W-50, 8, 40, 36)) { gameState = State.PAUSE; sfx('click'); return; }
    if (hitBtn(W-150, 8, 40, 36)) { gameSpeed = gameSpeed >= 3 ? 1 : gameSpeed + 1; sfx('click'); return; }
    if (hitBtn(W-250, 8, 80, 36)) {
      if (!roundActive && bloons.filter(b=>b.alive).length === 0) startRound();
      return;
    }
    if (hitBtn(W-340, 8, 70, 36)) { autoStart = !autoStart; sfx('click'); return; }
    const panelY = H - 120;
    for (let i = 0; i < TOWER_ORDER.length; i++) {
      const tx = 20 + i * 130;
      if (hitBtn(tx, panelY, 120, 100)) {
        const type = TOWER_ORDER[i];
        if (cash >= TOWER_DEFS[type].cost) { placingTower = type; selectedTower = null; sfx('click'); }
        return;
      }
    }
    if (selectedTower) {
      const px = W - 260, py = 60;
      for (let u = 0; u < 3; u++) {
        if (hitBtn(px + 10, py + 160 + u * 55, 230, 50)) {
          if (selectedTower.upgradeLevel === u) applyUpgrade(selectedTower);
          return;
        }
      }
      if (hitBtn(px + 10, py + 330, 230, 30)) {
        const modes = ['first','last','strong','close'];
        selectedTower.targeting = modes[(modes.indexOf(selectedTower.targeting)+1)%4];
        sfx('click'); return;
      }
      if (hitBtn(px + 10, py + 370, 110, 35)) {
        const val = Math.floor(selectedTower.totalCost * 0.7);
        cash += val;
        const idx = towers.indexOf(selectedTower);
        if (idx >= 0) towers.splice(idx, 1);
        spawnFloat(selectedTower.x, selectedTower.y, '+$' + val, '#4caf50');
        selectedTower = null; sfx('sell'); return;
      }
      if (hitBtn(px + 130, py + 370, 110, 35)) { selectedTower = null; sfx('click'); return; }
      if (hitBtn(px, py, 250, 420)) return;
    }
    if (placingTower) {
      if (my < H - 130) {
        if (canPlace(mx, my)) {
          const cost = TOWER_DEFS[placingTower].cost;
          if (cash >= cost) {
            cash -= cost; totalSpent += cost;
            towers.push(createTower(placingTower, mx, my));
            sfx('place');
            spawnSpriteAnim('fx_magic_', 6, mx, my, 40, 16);
            // Keep placement mode for multi-place if still affordable
            if (cash < TOWER_DEFS[placingTower].cost) placingTower = null;
          }
        }
      } else {
        placingTower = null;
      }
      return;
    }
    let found = null;
    for (const t of towers) if (dist(mx, my, t.x, t.y) < 28) { found = t; break; }
    selectedTower = found;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawSpriteButton(x, y, w, h, label, btnKey) {
  const hover = hitBtn(x, y, w, h);
  const key = btnKey || 'ui_btn_green';
  if (!drawImgTL(key, x, y, w, h)) {
    ctx.fillStyle = hover ? '#66bb6a' : '#4caf50';
    roundRect(x, y, w, h, 8); ctx.fill();
  }
  if (hover) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, 8); ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Segoe UI, Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 3;
  ctx.fillText(label, x + w/2, y + h/2 + 1);
  ctx.shadowBlur = 0;
  return hover;
}
function drawPanel(x, y, w, h, key) {
  if (!drawImgTL(key || 'ui_panel_md', x, y, w, h)) {

function drawBloon(b) {

  if (b.frozen > 0) {
    ctx.filter = 'hue-rotate(180deg) saturate(0.6) brightness(1.3)';
  }
  if (def.moab) ctx.rotate(Math.sin(b.propAngle) * 0.05);
  if (!drawImg(key, 0, 0, size, size, def.moab ? 0 : 0)) {
    // fallback oval
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.ellipse(0, 0, def.radius*0.85, def.radius, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.filter = 'none';
  if (b.camo) {
    ctx.strokeStyle = 'rgba(76,175,80,0.7)';
    ctx.lineWidth = 2; ctx.setLineDash([4, 3]);

    ctx.setLineDash([]);

  if (b.frozen > 0) {

    const barFg = img(pct > 0.5 ? 'ui_bar_green' : pct > 0.25 ? 'ui_bar_yellow' : 'ui_bar_red');
    if (barBg) ctx.drawImage(barBg, -bw/2, -size/2 - 16, bw, bh);
    else { ctx.fillStyle = '#333'; ctx.fillRect(-bw/2, -size/2 - 16, bw, bh); }
    if (barFg) ctx.drawImage(barFg, -bw/2, -size/2 - 16, bw * pct, bh);
    else { ctx.fillStyle = '#4caf50'; ctx.fillRect(-bw/2, -size/2 - 16, bw * pct, bh); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
    ctx.fillText(b.type.toUpperCase(), 0, -size/2 - 22);

}
function drawTower(t, preview) {
  const def = TOWER_DEFS[t.type];
  const bob = preview ? 0 : Math.sin(t.bob) * 1.5;
  const size = t.spriteSize || def.spriteSize || 52;
  // range
  if (selectedTower === t || preview) {
    const valid = !preview || canPlace(t.x, t.y);
    ctx.strokeStyle = preview ? (valid ? 'rgba(76,175,80,0.55)' : 'rgba(244,67,54,0.55)') : 'rgba(255,255,255,0.35)';
    ctx.fillStyle = preview ? (valid ? 'rgba(76,175,80,0.1)' : 'rgba(244,67,54,0.1)') : 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.range || def.range, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(t.x, t.y + size*0.35, size*0.28, size*0.12, 0, 0, Math.PI*2); ctx.fill();

  // Character towers: face-camera art + light idle animation (wizard style)
  if (t.type === 'wizard' && !preview) {
    const attacking = t.cooldown > 0 && t.cooldown > t.fireRate - 0.25;
    let key;
    if (attacking) {
      const af = Math.floor((1 - Math.max(0, t.cooldown - (t.fireRate - 0.25)) / 0.25) * 3) % 3;
      key = 'wizard_atk_' + af;
    } else {
      const fi = Math.floor(animT * 6 + t.bob) % 4;
      key = 'wizard_idle_' + fi;
    }
    const pulse = 0.28 + 0.12 * Math.sin(animT * 4 + t.bob);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ce93d8';
    ctx.beginPath(); ctx.arc(t.x, t.y + bob, size * 0.48, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    if (!drawImg(key, t.x, t.y + bob, size + 10, size + 10, 0)) {
      drawImg('tower_wizard', t.x, t.y + bob, size, size, 0);
    }
    for (let i = 0; i < 3; i++) {
      const a = animT * 3 + i * 2.1;
      const rr = size * 0.42;
      const sx = t.x + Math.cos(a) * rr;
      const sy = t.y + bob + Math.sin(a) * rr * 0.55;
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(animT * 5 + i);
      ctx.fillStyle = '#e1bee7';
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else {
    // 2-frame idle bob (same art family as wizard)
    const fi = Math.floor(animT * 4 + (t.bob || 0)) % 2;
    const animKey = 'tower_' + t.type + '_f' + fi;
    const key = img(animKey) ? animKey : ('tower_' + t.type);
    // soft type-colored aura
    const aura = {
      dart: '#81c784', sniper: '#66bb6a', bomb: '#90a4ae', ice: '#4fc3f7',
      farm: '#ffd54f', super: '#ef5350', tack: '#b0bec5'
    }[t.type];
    if (aura && !preview) {
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.08 * Math.sin(animT * 3 + t.bob);
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(t.x, t.y + bob, size * 0.45, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if (!drawImg(key, t.x, t.y + bob, size + 8, size + 8, 0)) {
      if (!drawImg('tower_' + t.type, t.x, t.y + bob, size, size, 0)) {
        ctx.fillStyle = def.color;
        ctx.beginPath(); ctx.arc(t.x, t.y + bob, 16, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  if (t.upgradeLevel > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('★'.repeat(t.upgradeLevel), t.x, t.y + size*0.45 + bob);
  }
}
function drawProjectile(p) {

      drawImgTL(tk, x + 20 + c * 64, y + 18 + r * 48, 64, 48);
    // mini path
    ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    map.path.forEach((p, j) => {
      const px = x + 20 + p.x * 260, py = y + 18 + p.y * 90;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    if (!unlocked) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      roundRect(x, y, 300, 210, 10); ctx.fill();
      ctx.font = '40px Segoe UI'; ctx.fillStyle = '#fff';
      ctx.fillText('🔒', x + 150, y + 90);
    }
    ctx.fillStyle = unlocked ? '#fff' : '#888';
    ctx.font = 'bold 17px Segoe UI';
    ctx.fillText(map.name, x + 150, y + 150);
    ctx.fillStyle = '#ffd700'; ctx.font = '15px Segoe UI';
    ctx.fillText(stars(map.difficulty), x + 150, y + 175);
    ctx.fillStyle = '#90caf9'; ctx.font = '12px Segoe UI';
    ctx.fillText(['','Beginner','Beginner','Intermediate','Advanced','Expert'][map.difficulty] || '', x + 150, y + 195);
  }
  drawSpriteButton(40, H - 70, 120, 40, '← Back', 'ui_btn_grey');
}
function drawDiffSelect() {
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 34px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('SELECT DIFFICULTY', W/2, 70);
  ctx.fillStyle = '#fff'; ctx.font = '20px Segoe UI';
  ctx.fillText(MAPS[selectedMap].name, W/2, 120);
  for (let i = 0; i < 4; i++) {
    const d = DIFFS[i];
    const x = 180 + i * 240, y = 260;
    drawPanel(x, y, 200, 170, 'ui_panel_md');
    if (hitBtn(x, y, 200, 170)) {
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      roundRect(x, y, 200, 170, 10); ctx.stroke();
    }
    ctx.font = '36px Segoe UI'; ctx.fillText(d.icon, x + 100, y + 45);
    ctx.fillStyle = d.color; ctx.font = 'bold 20px Segoe UI';
    ctx.fillText(d.name, x + 100, y + 85);
    ctx.fillStyle = '#ccc'; ctx.font = '13px Segoe UI';
    ctx.fillText(d.lives + ' lives  ·  $' + d.cash, x + 100, y + 120);
    ctx.fillStyle = '#fff';
  }
  drawSpriteButton(40, H - 70, 120, 40, '← Back', 'ui_btn_grey');
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  drawPanel(W/2 - 160, H/2 - 140, 320, 300, 'ui_panel_lg');
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 30px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W/2, H/2 - 90);
  ctx.fillStyle = '#aaa'; ctx.font = '14px Segoe UI';
  ctx.fillText('Round ' + round + ' · $' + cash + ' · ❤' + lives, W/2, H/2 - 55);
  drawSpriteButton(W/2-100, H/2-40, 200, 45, '▶ Resume', 'ui_btn_green');
  drawSpriteButton(W/2-100, H/2+20, 200, 45, '🔄 Restart', 'ui_btn_orange');
  drawSpriteButton(W/2-100, H/2+80, 200, 45, '🏠 Quit', 'ui_btn_red');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  drawPanel(W/2-200, H/2-160, 400, 360, 'ui_panel_lg');
  ctx.fillStyle = '#f44336'; ctx.font = 'bold 36px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2-100);
  ctx.fillStyle = '#fff'; ctx.font = '17px Segoe UI';
  ctx.fillText('Round ' + round + '/' + maxRounds, W/2, H/2-50);
  ctx.fillText('Popped: ' + totalPopped, W/2, H/2-20);
  drawSpriteButton(W/2-100, H/2+80, 200, 45, '🔄 Retry', 'ui_btn_orange');
  drawSpriteButton(W/2-100, H/2+140, 200, 45, '🏠 Menu', 'ui_btn_grey');
}
function drawVictory() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 20; i++) {
    const x = (i * 97 + animT * 40) % W, y = (i * 53 + animT * 70) % H;
    drawImg('bloon_' + ['red','yellow','blue','green'][i%4], x, y, 18, 18);
  }
  drawPanel(W/2-200, H/2-160, 400, 360, 'ui_panel_lg');
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('🏆 VICTORY!', W/2, H/2-100);
  ctx.fillStyle = '#fff'; ctx.font = '17px Segoe UI';
  ctx.fillText(MAPS[selectedMap].name + ' cleared!', W/2, H/2-50);
  ctx.fillText('Popped: ' + totalPopped, W/2, H/2-20);
  if (selectedMap < 4) {
    ctx.fillStyle = '#81c784';
    ctx.fillText('Unlocked: ' + MAPS[selectedMap+1].name, W/2, H/2+20);
  }
  drawSpriteButton(W/2-100, H/2+80, 200, 45, '🔄 Again', 'ui_btn_green');
  drawSpriteButton(W/2-100, H/2+140, 200, 45, '🏠 Menu', 'ui_btn_grey');
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  switch (gameState) {
    case State.LOADING: drawLoading(); break;
    case State.MAIN_MENU: drawMainMenu(); break;
    case State.MAP_SELECT: drawMapSelect(); break;
    case State.DIFFICULTY_SELECT: drawDiffSelect(); break;
    case State.GAMEPLAY:
    case State.PAUSE:
    case State.GAME_OVER:
    case State.VICTORY:
      drawMap();
      for (const fp of firePatches) {
        const fi = Math.floor(fp.frame) % 6;
        drawImg('fx_fire_' + fi, fp.x, fp.y, fp.r * 2.5, fp.r * 2.5);
      }
      for (const t of towers) drawTower(t);
      for (const b of bloons) if (b.alive) drawBloon(b);
      for (const p of projectiles) drawProjectile(p);
      drawSpriteAnims();
      drawParticles();
      drawHUD();
      if (gameState === State.PAUSE) drawPause();
      if (gameState === State.GAME_OVER) drawGameOver();
      if (gameState === State.VICTORY) drawVictory();
      break;
  }
}

function loop(now) {
  dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  handleClick();
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ─── BOOT ────────────────────────────────────────────────────
lastTime = performance.now();
requestAnimationFrame(loop);
loadAssets().then(() => {
  gameState = State.MAIN_MENU;
}).catch(err => {
  loadError = String(err);
  gameState = State.MAIN_MENU; // still playable with fallbacks
});

})();
</script>
</body>
</html>
