function loadAssets() {
  const keys = Object.keys(ASSET_MANIFEST);
  let loaded = 0, failed = 0;
  return new Promise(resolve => {
    if (!keys.length) { assetsReady = true; resolve(); return; }
    keys.forEach(key => {
      const img = new Image();
      img.onload = () => {
        ASSETS[key] = img;
        loaded++;
        assetLoadProgress = (loaded + failed) / keys.length;
        if (loaded + failed === keys.length) { assetsReady = true; resolve(); }
      };
      img.onerror = () => {
        failed++;
        assetLoadError = key;
        assetLoadProgress = (loaded + failed) / keys.length;
        console.warn('Asset missing:', key, ASSET_MANIFEST[key]);
        if (loaded + failed === keys.length) { assetsReady = true; resolve(); }
      };
      img.src = ASSET_BASE + ASSET_MANIFEST[key];
    });
  });
}

function img(key) { return ASSETS[key] || null; }

function drawImg(key, x, y, w, h, rot) {
  const im = img(key);
  if (!im) return false;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}

function drawImgTL(key, x, y, w, h) {
  const im = img(key);
  if (!im) return false;
  ctx.drawImage(im, x, y, w, h);
  return true;

// ─── AUDIO ───────────────────────────────────────────────────
let audioCtx = null, muted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='square', vol=0.08, slide=0) {
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfx(name) {
  ensureAudio();
  switch(name) {
    case 'pop': beep(800 + Math.random()*400, 0.06, 'square', 0.05); break;
    case 'explode': beep(80, 0.25, 'sawtooth', 0.12, -40); break;
    case 'freeze': beep(1200, 0.15, 'sine', 0.06, 400); break;
    case 'place': beep(200, 0.1, 'triangle', 0.1); beep(300, 0.08, 'triangle', 0.06); break;
    case 'upgrade': beep(400, 0.08, 'sine', 0.08); setTimeout(()=>beep(600,0.08,'sine',0.08),80); setTimeout(()=>beep(800,0.12,'sine',0.1),160); break;
    case 'round': beep(440, 0.1, 'square', 0.08); setTimeout(()=>beep(550,0.1,'square',0.08),100); setTimeout(()=>beep(660,0.15,'square',0.1),200); break;
    case 'gameover': beep(400, 0.2, 'sawtooth', 0.1, -200); setTimeout(()=>beep(200,0.4,'sawtooth',0.1,-100),250); break;
    case 'victory': beep(523,0.15,'square',0.1); setTimeout(()=>beep(659,0.15,'square',0.1),150); setTimeout(()=>beep(784,0.15,'square',0.1),300); setTimeout(()=>beep(1047,0.3,'square',0.12),450); break;
    case 'click': beep(600, 0.04, 'square', 0.04); break;
    case 'cash': beep(900, 0.06, 'sine', 0.05); break;

// ─── UTILS ───────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(x1, y1, x2, y2) { const dx=x2-x1, dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
function dist2(x1, y1, x2, y2) { const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; }
function rand(a, b) { return a + Math.random() * (b - a); }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(4-n); }

function resize() {
  const vw = Math.max(window.innerWidth, 1280);
  const vh = Math.max(window.innerHeight, 720);
  canvas.width = vw;
  canvas.height = vh;
  scale = Math.min(vw / BASE_W, vh / BASE_H);
  W = BASE_W; H = BASE_H;
  ox = (vw - BASE_W * scale) / 2;
  oy = (vh - BASE_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

function sx(x) { return ox + x * scale; }
function sy(y) { return oy + y * scale; }
function toGame(cx, cy) { return { x: (cx - ox) / scale, y: (cy - oy) / scale }; }

// ─── PATH HELPERS ────────────────────────────────────────────
function buildPath(map) {
  const paths = [];
  if (map.multiPath) {
    paths.push(map.path.map(p => ({ x: p.x * W, y: p.y * (H - 140) + 50 })));
    paths.push(map.path2.map(p => ({ x: p.x * W, y: p.y * (H - 140) + 50 })));
  } else {
    paths.push(map.path.map(p => ({ x: p.x * W, y: p.y * (H - 140) + 50 })));
  }
  return paths;
}

function pathMetrics(pts) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const l = dist(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    segs.push(l);
    total += l;
  }
  return { segs, total };
}

function posOnPath(pts, segs, total, t) {
  t = clamp(t, 0, 1);
  let d = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i] || i === segs.length - 1) {
      const f = segs[i] > 0 ? d / segs[i] : 0;
      return {
        x: lerp(pts[i].x, pts[i+1].x, f),
        y: lerp(pts[i].y, pts[i+1].y, f)
      };
    }
    d -= segs[i];
  }
  return { x: pts[pts.length-1].x, y: pts[pts.length-1].y };
}

function distToPath(px, py, pts) {
  let minD = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i].x, ay = pts[i].y, bx = pts[i+1].x, by = pts[i+1].y;
    const abx = bx-ax, aby = by-ay;
    const t = clamp(((px-ax)*abx + (py-ay)*aby) / (abx*abx + aby*aby + 0.001), 0, 1);
    const d = dist(px, py, ax + abx*t, ay + aby*t);
    if (d < minD) minD = d;
  }
  return minD;
}

// ─── BLOON ───────────────────────────────────────────────────
function createBloon(type, pathIdx, progress, camo) {
  const def = BLOON_TYPES[type];
  if (!def) return null;
  return {
    type, pathIdx: pathIdx||0, progress: progress||0,
    hp: def.hp, maxHp: def.hp, camo: !!camo,
    frozen: 0, freezeSlow: 1, permafrost: 0,
    x: 0, y: 0, alive: true, rbe: def.rbe,
    wobble: Math.random() * Math.PI * 2,
    propAngle: 0
  };
}

function spawnBloon(type, pathIdx, camo) {
  const b = createBloon(type, pathIdx, 0, camo);
  if (b) bloons.push(b);
  return b;
}

function damageBloon(b, dmg, source) {
  if (!b.alive) return;
  const def = BLOON_TYPES[b.type];
  // immunities
  if (source) {
    if (def.immune) {
      if (def.immune.includes('bomb') && source.projType === 'bomb') return false;
      if (def.immune.includes('magic') && (source.projType === 'magic' || source.projType === 'laser' || source.projType === 'plasma')) return false;
      if (def.immune.includes('sharp') && !source.canPopLead && (source.projType === 'dart' || source.projType === 'tack' || source.projType === 'spike' || source.projType === 'sniper')) return false;
      if (def.immune.includes('freeze') && source.projType === 'freeze') return false;
    }
    if (b.frozen > 0 && !source.canPopFrozen && source.projType !== 'freeze') return false;
    if (b.camo && !source.canSeeCamo) return false;
  }
  // MOAB damage multiplier
  let actual = dmg;
  if (def.moab && source && source.moabMul) actual *= source.moabMul;

  b.hp -= actual;
  if (b.hp <= 0) {
    popBloon(b, source);
    return true;
  }
  return false;
}

function popBloon(b, source) {
  if (!b.alive) return;
  b.alive = false;
  const def = BLOON_TYPES[b.type];
  cash += def.cash;
  totalPopped++;
  if (def.moab) {
    spawnExplosion(b.x, b.y, def.radius);
    spawnParticles(b.x, b.y, def.color || '#ff00ff', 14, 200);
  } else {
    spawnPopFx(b.x, b.y);
    spawnParticles(b.x, b.y, def.color || '#ff00ff', 5, 90);
    sfx('pop');
  }
  spawnFloat(b.x, b.y - 10, '+$' + def.cash, '#ffd700');

  // children
  const children = def.children;
  if (children && children.length) {
    const spacing = 0.008;
    children.forEach((ct, i) => {
      const child = createBloon(ct, b.pathIdx, Math.max(0, b.progress - i * spacing), b.camo);
      if (child) {
        if (b.permafrost > 0) child.permafrost = b.permafrost;
        bloons.push(child);
      }
    });
  }
}

function freezeBloon(b, duration, permafrost, arctic) {
  const def = BLOON_TYPES[b.type];
  if (def.moab) return; // MOABs immune to freeze
  if (def.immune && def.immune.includes('freeze')) return;
  const wasFrozen = b.frozen > 0.05;
  b.frozen = Math.max(b.frozen, duration);
  if (permafrost) b.permafrost = 0.5;
  if (arctic) b.freezeSlow = 0.5;
  if (!wasFrozen) spawnFreezeFx(b.x, b.y, def.radius + 12);
}

// ─── TOWER ───────────────────────────────────────────────────
function createTower(type, x, y) {
  const def = TOWER_DEFS[type];
  return {
    type, x, y,
    range: def.range, fireRate: def.fireRate, damage: def.damage, pierce: def.pierce,
    projSpeed: def.projSpeed, projType: def.projType, special: def.special,
    canPopLead: def.canPopLead, canPopFrozen: def.canPopFrozen, canPopPurple: def.canPopPurple,
    canSeeCamo: !!def.canSeeCamo, aoeRadius: def.aoeRadius || 0, freezeTime: def.freezeTime || 0,
    income: def.income || 0, tackCount: def.tackCount || 8, moabMul: 1,
    fireball: false, wallOfFire: false, arctic: false, permafrost: false, sunAvatar: false,
    upgradeLevel: 0, targeting: 'first',
    cooldown: 0, angle: 0, totalCost: def.cost,
    bob: Math.random() * Math.PI * 2, fireballCD: 0, wallCD: 0
  };
}

function applyUpgrade(tower) {
  const def = TOWER_DEFS[tower.type];
  if (tower.upgradeLevel >= 3) return false;
  const up = def.upgrades[tower.upgradeLevel];
  if (cash < up.cost) return false;
  cash -= up.cost;
  totalSpent += up.cost;
  tower.totalCost += up.cost;
  tower.upgradeLevel++;
  const c = up.changes;
  if (c.pierce) tower.pierce += c.pierce;
  if (c.damage) tower.damage += c.damage;
  if (c.fireRate) tower.fireRate = Math.max(0.04, tower.fireRate + c.fireRate);
  if (c.range) tower.range += c.range;
  if (c.aoeRadius) tower.aoeRadius += c.aoeRadius;
  if (c.freezeTime) tower.freezeTime += c.freezeTime;
  if (c.income) tower.income += c.income;
  if (c.tackCount) tower.tackCount += c.tackCount;
  if (c.moabMul) tower.moabMul = c.moabMul;
  if (c.canPopLead) tower.canPopLead = true;
  if (c.canPopFrozen) tower.canPopFrozen = true;
  if (c.projType) tower.projType = c.projType;
  if (c.fireball) tower.fireball = true;
  if (c.wallOfFire) tower.wallOfFire = true;
  if (c.permafrost) tower.permafrost = true;
  if (c.arctic) tower.arctic = true;
  if (c.sunAvatar) tower.sunAvatar = true;
  sfx('upgrade');
  particles.push({ x: tower.x, y: tower.y, vx:0, vy:0, life:0.5, maxLife:0.5, r: tower.range*0.3, color:'#ffd700', type:'ring', grow: tower.range });
  return true;
}

function getTarget(tower) {
  let best = null, bestVal = -Infinity, worstVal = Infinity, closest = Infinity, strongest = -1;
  const r2 = tower.range * tower.range;
  const inf = tower.special === 'infinite_range';
  for (const b of bloons) {
    if (!b.alive) continue;
    if (b.camo && !tower.canSeeCamo) continue;
    const d2 = dist2(tower.x, tower.y, b.x, b.y);
    if (!inf && d2 > r2) continue;
    const d = Math.sqrt(d2);
    switch (tower.targeting) {
      case 'first':
        if (b.progress > bestVal) { bestVal = b.progress; best = b; }
        break;
      case 'last':
        if (b.progress < worstVal) { worstVal = b.progress; best = b; }
        break;
      case 'strong':
        if (b.rbe > strongest || (b.rbe === strongest && b.progress > bestVal)) {
          strongest = b.rbe; bestVal = b.progress; best = b;
        }
        break;
      case 'close':
        if (d < closest) { closest = d; best = b; }
        break;
    }
  }
  return best;
}

function fireTower(tower, target) {
  tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
  const def = TOWER_DEFS[tower.type];

  if (tower.special === 'freeze' || tower.projType === 'freeze') {
    // AoE freeze
    for (const b of bloons) {
      if (!b.alive) continue;
      if (dist2(tower.x, tower.y, b.x, b.y) <= tower.range * tower.range) {
        freezeBloon(b, tower.freezeTime, tower.permafrost, tower.arctic);
      }
    }
    spawnParticles(tower.x, tower.y, '#4fc3f7', 10, 60);
    sfx('freeze');
    return;
  }

  if (tower.special === 'radial' || tower.projType === 'tack') {
    const n = tower.tackCount;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      projectiles.push(makeProj(tower, tower.x, tower.y, Math.cos(a)*tower.projSpeed, Math.sin(a)*tower.projSpeed, null));
    }
    return;
  }

  if (tower.sunAvatar) {
    // 3 beams
    for (let i = -1; i <= 1; i++) {
      const a = tower.angle + i * 0.25;
      projectiles.push(makeProj(tower, tower.x, tower.y, Math.cos(a)*tower.projSpeed, Math.sin(a)*tower.projSpeed, target));
    }
    return;
  }

  // sniper: instant hit
  if (tower.projType === 'sniper') {
    damageBloon(target, tower.damage, tower);
    particles.push({ x: target.x, y: target.y, vx:0, vy:0, life:0.15, maxLife:0.15, r:4, color:'#fff', type:'circle' });
    // draw line briefly
    particles.push({ x: tower.x, y: tower.y, x2: target.x, y2: target.y, life:0.08, maxLife:0.08, color:'#fff59d', type:'line' });
    return;
  }

  // homing magic
  const isHoming = tower.projType === 'magic' || tower.projType === 'laser' || tower.projType === 'plasma';
  let vx, vy;
  if (isHoming) {
    const d = dist(tower.x, tower.y, target.x, target.y) || 1;
    vx = (target.x - tower.x) / d * tower.projSpeed;
    vy = (target.y - tower.y) / d * tower.projSpeed;
  } else {
    // lead target
    const lead = 0.15;
    const tx = target.x, ty = target.y;
    const d = dist(tower.x, tower.y, tx, ty) || 1;
    vx = (tx - tower.x) / d * tower.projSpeed;
    vy = (ty - tower.y) / d * tower.projSpeed;
  }
  projectiles.push(makeProj(tower, tower.x, tower.y, vx, vy, isHoming ? target : null));

  // fireball occasional
  if (tower.fireball && Math.random() < 0.25) {
    const p = makeProj(tower, tower.x, tower.y, vx*0.8, vy*0.8, target);
    p.projType = 'fireball';
    p.aoeRadius = 50;
    p.damage = tower.damage + 2;
    p.color = '#ff6d00';
    projectiles.push(p);
  }
  // wall of fire
  if (tower.wallOfFire && tower.wallCD <= 0) {
    tower.wallCD = 4;
    firePatches.push({ x: target.x, y: target.y, life: 5, maxLife: 5, r: 30, dmgTimer: 0 });
  }
}

function makeProj(tower, x, y, vx, vy, target) {
  return {
    x, y, vx, vy, target,
    damage: tower.damage, pierce: tower.pierce, hit: [],
    projType: tower.projType, aoeRadius: tower.aoeRadius || 0,
    canPopLead: tower.canPopLead, canPopFrozen: tower.canPopFrozen,
    canPopPurple: tower.canPopPurple, canSeeCamo: tower.canSeeCamo,
    moabMul: tower.moabMul, life: 2.5, r: 4,
    color: projColor(tower.projType),
    source: tower
  };
}

function projColor(type) {
  switch(type) {
    case 'dart': case 'spike': return '#5d4037';
    case 'bomb': return '#37474f';
    case 'magic': return '#ce93d8';
    case 'laser': return '#ef5350';
    case 'plasma': return '#69f0ae';
    case 'tack': return '#90a4ae';
    case 'fireball': return '#ff6d00';
    default: return '#fff';
  }
}

// ─── PLACEMENT ───────────────────────────────────────────────
function canPlace(x, y) {
  if (y < 55 || y > H - 145) return false;
  if (x < 20 || x > W - 20) return false;
  // path check
  for (const p of gamePaths) {
    if (distToPath(x, y, p) < 32) return false;
  }
  // other towers
  for (const t of towers) {
    if (dist(x, y, t.x, t.y) < 40) return false;
  }
  // map-specific blocked zones
  const map = MAPS[selectedMap];
  if (map.name === 'Tree Stump') {
    if (dist(x, y, W*0.5, (H-140)*0.5+50) < 55) return false;
  }
  if (map.name === 'Frozen Lake') {
    // lake center roughly
    if (dist(x, y, W*0.5, (H-140)*0.4+50) < 70) return false;
  }
  return true;
}

// ─── GAME SETUP ──────────────────────────────────────────────
let gamePaths = [], pathMetricsArr = [];

function startGame() {
  const d = DIFFS[selectedDiff];
  lives = d.lives;
  cash = d.cash;
  round = 0;
  totalPopped = 0;
  totalSpent = 0;
  gameSpeed = 1;
  bloons = [];
  towers = [];
  projectiles = [];
  particles = [];
  floatTexts = [];
  firePatches = [];
  placingTower = null;
  selectedTower = null;
  roundActive = false;
  spawnQueue = [];
  betweenRoundTimer = 1.5;
  startTime = performance.now();
  gamePaths = buildPath(MAPS[selectedMap]);
  pathMetricsArr = gamePaths.map(p => pathMetrics(p));
  gameState = State.GAMEPLAY;
  sfx('click');
}

function startRound() {
  round++;
  if (round > maxRounds) {
    winGame();
    return;
  }
  const waves = ROUNDS[round] || [{t:'red',c:10,s:0.4}];
  spawnQueue = [];
  let time = 0;
  waves.forEach(w => {
    time += (w.d || 0);
    for (let i = 0; i < w.c; i++) {
      spawnQueue.push({
        type: w.t, time: time + i * (w.s || 0.4),
        camo: !!w.camo,
        pathIdx: MAPS[selectedMap].multiPath ? (i % 2) : 0
      });
    }
  });
  spawnQueue.sort((a, b) => a.time - b.time);
  spawnTimer = 0;
  roundActive = true;
  sfx('round');
}

function endRound() {
  roundActive = false;
  // income
  const bonus = 100 + round;
  cash += bonus;
  spawnFloat(W/2, 100, '+$' + bonus + ' round income', '#ffd700');
  // farms
  for (const t of towers) {
    if (t.special === 'income' && t.income > 0) {
      cash += t.income;
      spawnFloat(t.x, t.y - 20, '+$' + t.income, '#ffeb3b');
      spawnParticles(t.x, t.y, '#ffeb3b', 6, 40);
    }
  }
  sfx('cash');
  if (round >= maxRounds) {
    winGame();
    return;
  }
  betweenRoundTimer = 1.0;
  if (autoStart) {
    // auto-start next round after brief pause (handled in update)
  }
}

function winGame() {
  gameState = State.VICTORY;
  sfx('victory');
  // unlock next map
  if (selectedMap < 4) {
    unlockedMaps[selectedMap + 1] = true;
    try { localStorage.setItem('md6_unlocked', JSON.stringify(unlockedMaps)); } catch(e) {}
  }
}

function loseGame() {
  gameState = State.GAME_OVER;
  sfx('gameover');
}

// ─── UPDATE ──────────────────────────────────────────────────
function update(rawDt) {
  animT += rawDt;
  const d = DIFFS[selectedDiff];
  const t = rawDt * gameSpeed;

  if (gameState === State.GAMEPLAY) {
    updateGameplay(t, d);
  }
  // particles always
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= rawDt;
    p.x += (p.vx || 0) * rawDt;
    p.y += (p.vy || 0) * rawDt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= rawDt;
    f.y += f.vy * rawDt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
}

function updateGameplay(t, diff) {
  // between rounds (auto-start)
  if (!roundActive && bloons.filter(b => b.alive).length === 0 && autoStart && round < maxRounds) {
    betweenRoundTimer -= t / gameSpeed;
    if (betweenRoundTimer <= 0) startRound();
  }

  // spawning
  if (roundActive) {
    spawnTimer += t;
    while (spawnQueue.length && spawnQueue[0].time <= spawnTimer) {
      const s = spawnQueue.shift();
      spawnBloon(s.type, s.pathIdx, s.camo);
    }
    if (spawnQueue.length === 0 && bloons.every(b => !b.alive || !b)) {
      // wait for all dead
    }
    if (spawnQueue.length === 0 && bloons.filter(b => b.alive).length === 0) {
      endRound();
    }
  }

  // update bloons
  for (let i = bloons.length - 1; i >= 0; i--) {
    const b = bloons[i];
    if (!b.alive) { bloons.splice(i, 1); continue; }
    const def = BLOON_TYPES[b.type];
    const pm = pathMetricsArr[b.pathIdx] || pathMetricsArr[0];
    const pts = gamePaths[b.pathIdx] || gamePaths[0];
    let speed = def.speed * 55 * diff.speedMul;
    if (b.frozen > 0) {
      b.frozen -= t;
      speed = 0;
      if (b.frozen <= 0 && b.permafrost > 0) {
        // thawed with slow
      }
    } else {
      speed *= (1 - (b.permafrost || 0));
      speed *= b.freezeSlow || 1;
    }
    b.progress += (speed * t) / pm.total;
    b.wobble += t * 8;
    if (def.moab) b.propAngle += t * 10;
    const pos = posOnPath(pts, pm.segs, pm.total, b.progress);
    b.x = pos.x;
    b.y = pos.y + Math.sin(b.wobble) * 1.5;
    if (b.progress >= 1) {
      // leaked
      lives -= b.rbe;
      b.alive = false;
      bloons.splice(i, 1);
      spawnFloat(b.x, b.y, '-' + b.rbe + ' lives', '#f44336');
      if (lives <= 0) { lives = 0; loseGame(); }
    }
  }

  // fire patches
  for (let i = firePatches.length - 1; i >= 0; i--) {
    const fp = firePatches[i];
    fp.life -= t;
    fp.dmgTimer -= t;
    if (fp.dmgTimer <= 0) {
      fp.dmgTimer = 0.3;
      for (const b of bloons) {
        if (b.alive && dist2(fp.x, fp.y, b.x, b.y) < fp.r * fp.r) {
          damageBloon(b, 1, { projType: 'magic', canPopLead: true, canPopFrozen: true, canPopPurple: false });
        }
      }
      spawnParticles(fp.x + rand(-15,15), fp.y + rand(-15,15), '#ff6d00', 2, 30);
    }
    if (fp.life <= 0) firePatches.splice(i, 1);
  }

  // towers
  for (const tower of towers) {
    tower.bob += t * 2;
    tower.cooldown -= t;
    if (tower.wallCD > 0) tower.wallCD -= t;
    if (tower.special === 'income') continue;
    // arctic wind permanent slow
    if (tower.arctic) {
      for (const b of bloons) {
        if (b.alive && dist2(tower.x, tower.y, b.x, b.y) <= tower.range * tower.range) {
          b.freezeSlow = 0.5;
        }
      }
    }
    if (tower.cooldown <= 0) {
      const target = getTarget(tower);
      if (target || tower.projType === 'freeze') {
        if (tower.projType === 'freeze') {
          // check any in range
          let any = false;
          for (const b of bloons) {
            if (b.alive && dist2(tower.x, tower.y, b.x, b.y) <= tower.range * tower.range) { any = true; break; }
          }
          if (any) {
            fireTower(tower, bloons[0]);
            tower.cooldown = tower.fireRate;
          }
        } else if (target) {
          fireTower(tower, target);
          tower.cooldown = tower.fireRate;
        }
      }
    }
  }

  // projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= t;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }
    // homing
    if (p.target && p.target.alive) {
      const d = dist(p.x, p.y, p.target.x, p.target.y) || 1;
      const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      p.vx = (p.target.x - p.x) / d * spd;
      p.vy = (p.target.y - p.y) / d * spd;
    }
    p.x += p.vx * t;
    p.y += p.vy * t;
    // trail
    if (p.projType === 'laser' || p.projType === 'plasma' || p.projType === 'magic') {
      if (Math.random() < 0.3) particles.push({ x: p.x, y: p.y, vx:0, vy:0, life:0.15, maxLife:0.15, r:2, color: p.color, type:'circle' });
    }
    // collide
    let hit = false;
    for (const b of bloons) {
      if (!b.alive || p.hit.includes(b)) continue;
      const br = BLOON_TYPES[b.type].radius;
      if (dist2(p.x, p.y, b.x, b.y) < (br + p.r) * (br + p.r)) {
        p.hit.push(b);
        if (p.projType === 'bomb' || p.projType === 'fireball') {
          // AoE
          const ar = p.aoeRadius || 40;
          for (const b2 of bloons) {
            if (b2.alive && dist2(p.x, p.y, b2.x, b2.y) < ar * ar) {
              damageBloon(b2, p.damage, p);
            }
          }
          spawnExplosion(p.x, p.y, ar);
          sfx('explode');
          hit = true;
          break;
        } else {
          damageBloon(b, p.damage, p);
          p.pierce--;
          if (p.pierce <= 0) { hit = true; break; }
        }
      }
    }
    if (hit) projectiles.splice(i, 1);
    else if (p.x < -50 || p.x > W+50 || p.y < -50 || p.y > H+50) projectiles.splice(i, 1);
  }
}

// ─── INPUT ───────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const g = toGame(e.clientX - r.left, e.clientY - r.top);
  mouse.x = g.x; mouse.y = g.y;
});
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const r = canvas.getBoundingClientRect();
  const g = toGame(e.clientX - r.left, e.clientY - r.top);
  mouse.x = g.x; mouse.y = g.y;
  mouse.down = true;
  mouse.clicked = true;
  if (e.button === 2) mouse.right = true;
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'Escape') {
    if (gameState === State.GAMEPLAY) { gameState = State.PAUSE; sfx('click'); }
    else if (gameState === State.PAUSE) { gameState = State.GAMEPLAY; }
    else if (placingTower) { placingTower = null; }
  }
  if (e.key === ' ' && gameState === State.GAMEPLAY) {
    e.preventDefault();
    if (!roundActive && bloons.filter(b=>b.alive).length === 0) startRound();
  }
  if ((e.key === '1' || e.key === '2' || e.key === '3') && gameState === State.GAMEPLAY) {
    gameSpeed = parseInt(e.key);
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function hitBtn(x, y, w, h) {
  return mouse.x >= x && mouse.x <= x+w && mouse.y >= y && mouse.y <= y+h;
}

function handleClick() {
  if (!mouse.clicked) return;
  mouse.clicked = false;
  const mx = mouse.x, my = mouse.y;

  if (gameState === State.MAIN_MENU) {
    if (hitBtn(W/2-120, H/2+20, 240, 60)) { gameState = State.MAP_SELECT; sfx('click'); }
    if (hitBtn(W-80, 20, 50, 40)) { muted = !muted; sfx('click'); }
    return;
  }
  if (gameState === State.MAP_SELECT) {
    if (hitBtn(40, H-70, 120, 40)) { gameState = State.MAIN_MENU; sfx('click'); return; }
    // map cards
    for (let i = 0; i < MAPS.length; i++) {
      const col = i % 3, row = Math.floor(i / 3);
      const x = 140 + col * 340, y = 140 + row * 240;
      if (hitBtn(x, y, 300, 200) && unlockedMaps[i]) {
        selectedMap = i;
        gameState = State.DIFFICULTY_SELECT;
        sfx('click');
      }
    }
    return;
  }
  if (gameState === State.DIFFICULTY_SELECT) {
    if (hitBtn(40, H-70, 120, 40)) { gameState = State.MAP_SELECT; sfx('click'); return; }
    for (let i = 0; i < 4; i++) {
      const x = 180 + i * 240, y = 280;
      if (hitBtn(x, y, 200, 160)) {
        selectedDiff = i;
        startGame();
      }
    }
    return;
  }
  if (gameState === State.PAUSE) {
    if (hitBtn(W/2-100, H/2-40, 200, 45)) { gameState = State.GAMEPLAY; sfx('click'); }
    if (hitBtn(W/2-100, H/2+20, 200, 45)) { startGame(); sfx('click'); }
    if (hitBtn(W/2-100, H/2+80, 200, 45)) { gameState = State.MAIN_MENU; sfx('click'); }
    return;
  }
  if (gameState === State.GAME_OVER || gameState === State.VICTORY) {
    if (hitBtn(W/2-100, H/2+80, 200, 45)) { startGame(); sfx('click'); }
    if (hitBtn(W/2-100, H/2+140, 200, 45)) { gameState = State.MAIN_MENU; sfx('click'); }
    return;
  }
  if (gameState === State.GAMEPLAY) {
    // HUD buttons
    if (hitBtn(W-50, 8, 40, 36)) { gameState = State.PAUSE; sfx('click'); return; }
    if (hitBtn(W-150, 8, 40, 36)) { gameSpeed = gameSpeed >= 3 ? 1 : gameSpeed + 1; sfx('click'); return; }
    if (hitBtn(W-250, 8, 80, 36)) {
      if (!roundActive && bloons.filter(b=>b.alive).length === 0) startRound();
      return;
    }
    if (hitBtn(W-340, 8, 70, 36)) { autoStart = !autoStart; sfx('click'); return; }

    // tower panel
    const panelY = H - 120;
    for (let i = 0; i < TOWER_ORDER.length; i++) {
      const tx = 20 + i * 130;
      if (hitBtn(tx, panelY, 120, 100)) {
        const type = TOWER_ORDER[i];
        const cost = TOWER_DEFS[type].cost;
        if (cash >= cost) {
          placingTower = type;
          selectedTower = null;
          sfx('click');
        }
        return;
      }
    }

    // tower info panel
    if (selectedTower) {
      const px = W - 260, py = 60;
      // upgrades
      const def = TOWER_DEFS[selectedTower.type];
      for (let u = 0; u < 3; u++) {
        if (hitBtn(px + 10, py + 160 + u * 55, 230, 50)) {
          if (selectedTower.upgradeLevel === u) applyUpgrade(selectedTower);
          return;
        }
      }
      // targeting
      if (hitBtn(px + 10, py + 330, 230, 30)) {
        const modes = ['first','last','strong','close'];
        const idx = modes.indexOf(selectedTower.targeting);
        selectedTower.targeting = modes[(idx+1)%4];
        sfx('click');
        return;
      }
      // sell
      if (hitBtn(px + 10, py + 370, 110, 35)) {
        const val = Math.floor(selectedTower.totalCost * 0.7);
        cash += val;
        const idx = towers.indexOf(selectedTower);
        if (idx >= 0) towers.splice(idx, 1);
        spawnFloat(selectedTower.x, selectedTower.y, '+$' + val, '#4caf50');
        selectedTower = null;
        sfx('sell');
        return;
      }
      // close
      if (hitBtn(px + 130, py + 370, 110, 35)) {
        selectedTower = null;
        sfx('click');
        return;
      }
      // click on panel doesn't place
      if (hitBtn(px, py, 250, 420)) return;
    }

    // placing
    if (placingTower) {
      if (canPlace(mx, my) && my < H - 130) {
        const cost = TOWER_DEFS[placingTower].cost;
        if (cash >= cost) {
          cash -= cost;
          totalSpent += cost;
          towers.push(createTower(placingTower, mx, my));
          sfx('place');
          spawnParticles(mx, my, '#ffd700', 8, 50);
        }
      }
      // right click or second click on panel cancels — keep placement mode for multi-place
      // click outside map cancels
      if (my > H - 130) placingTower = null;
      return;
    }

    // select tower
    let found = null;
    for (const t of towers) {
      if (dist(mx, my, t.x, t.y) < 28) { found = t; break; }
    }
    selectedTower = found;
  }
}

// ─── DRAWING HELPERS ─────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function buttonSpriteFor(color) {
  if (!color) return 'ui_btn_grey';
  const c = color.toLowerCase();
  if (c.includes('4caf50') || c.includes('43a047') || c.includes('81c784')) return 'ui_btn_green';
  if (c.includes('e53935') || c.includes('f44336') || c.includes('c62828')) return 'ui_btn_red';
  if (c.includes('ff9800') || c.includes('ff6d00') || c.includes('ffc107')) return 'ui_btn_orange';
  if (c.includes('7c4dff') || c.includes('9c27b0') || c.includes('7b1fa2')) return 'ui_btn_purple';
  return 'ui_btn_grey';
}

function drawButton(x, y, w, h, label, color, hover) {
  const isH = hitBtn(x, y, w, h);
  ctx.save();
  if (isH || hover) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
  }
  const key = buttonSpriteFor(color);
  const im = img(key);
  if (im) {
    // 9-slice-ish: stretch sprite button
    ctx.globalAlpha = isH ? 1 : 0.92;
    ctx.drawImage(im, x, y, w, h);
    ctx.globalAlpha = 1;
    if (isH) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 10);
      ctx.stroke();
    }
  } else {
    const grad = ctx.createLinearGradient(x, y, x, y+h);
    grad.addColorStop(0, isH ? lighten(color, 30) : color);
    grad.addColorStop(1, darken(color, 30));
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Segoe UI, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 3;
  ctx.fillText(label, x + w/2, y + h/2);
  ctx.restore();
  return isH;
}

function lighten(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((c>>16)&0xff)+amt);
  const g = Math.min(255, ((c>>8)&0xff)+amt);
  const b = Math.min(255, (c&0xff)+amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((c>>16)&0xff)-amt);
  const g = Math.max(0, ((c>>8)&0xff)-amt);
  const b = Math.max(0, (c&0xff)-amt);
  return `rgb(${r},${g},${b})`;
}

function panel(x, y, w, h, alpha) {
  const im = img(w > 300 ? 'ui_panel_lg' : (h > 300 ? 'ui_panel_tower' : 'ui_panel_md'));
  if (im) {
    ctx.save();
    ctx.globalAlpha = alpha || 0.95;
    ctx.drawImage(im, x, y, w, h);
    ctx.globalAlpha = 1;
    ctx.restore();
  } else {
    ctx.fillStyle = `rgba(22, 33, 62, ${alpha||0.9})`;
    roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

// ─── DRAW MAP (Kenney tile grid) ─────────────────────────────
function drawMap() {
  const map = MAPS[selectedMap];
  const theme = MAP_THEMES[selectedMap] || MAP_THEMES[0];
  const tileSize = 64;
  const top = 50, bottom = H - 120;
  const areaH = bottom - top;

  // Tiled ground
  const gIm = img(theme.ground);
  const gAlt = img(theme.groundAlt);
  if (gIm) {
    for (let ty = top; ty < bottom; ty += tileSize) {
      for (let tx = 0; tx < W; tx += tileSize) {
        const useAlt = ((tx / tileSize) + (ty / tileSize)) % 3 === 0;
        const im = (useAlt && gAlt) ? gAlt : gIm;
        ctx.drawImage(im, tx, ty, tileSize + 1, tileSize + 1);
      }
    }
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, map.bg);
    grad.addColorStop(1, map.bg2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, top, W, areaH);
  }

  // Path with dirt tile pattern
  const dirtIm = img(theme.path) || img('tile_dirt');
  for (const pts of gamePaths) {
    // soft edge
    ctx.strokeStyle = 'rgba(93,64,55,0.85)';
    ctx.lineWidth = 46;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    if (dirtIm) {
      // stamp dirt tiles along path
      for (let i = 0; i < pts.length - 1; i++) {
        const ax = pts[i].x, ay = pts[i].y, bx = pts[i+1].x, by = pts[i+1].y;
        const segLen = dist(ax, ay, bx, by);
        const steps = Math.max(1, Math.ceil(segLen / 28));
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const px = lerp(ax, bx, t), py = lerp(ay, by, t);
          ctx.save();
          ctx.beginPath();
          ctx.arc(px, py, 18, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(dirtIm, px - 32, py - 32, 64, 64);
          ctx.restore();
        }
      }
    } else {
      ctx.strokeStyle = '#a1887f';
      ctx.lineWidth = 34;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // decorations (sprite-based)
  for (const d of map.decorations) {
    const x = d.x * W, y = d.y * (H - 140) + 50;
    drawDecoration(d.type, x, y);
  }

  // entrance / exit markers
  for (const pts of gamePaths) {
    ctx.fillStyle = 'rgba(76,175,80,0.9)';
    ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(244,67,54,0.9)';
    const last = pts[pts.length-1];
    ctx.beginPath(); ctx.arc(last.x, last.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.stroke();
  }
}

function drawDecoration(type, x, y) {
  const key = DECOR_SPRITES[type];
  const sizes = {
    tree: 56, pine: 56, flower: 36, rock: 40, stump: 72, mushroom: 36,
    lake: 140, snowman: 48, lava: 80, castle: 100, wall: 64, torch: 40
  };
  const s = sizes[type] || 48;

  // special layered decorations
  if (type === 'lake') {
    const im = img('tile_water');
    if (im) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(x, y, 90, 55, 0, 0, Math.PI * 2);
      ctx.clip();
      for (let dy = -64; dy < 64; dy += 64)
        for (let dx = -96; dx < 96; dx += 64)
          ctx.drawImage(im, x + dx, y + dy, 64, 64);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y, 90, 55, 0, 0, Math.PI * 2);
      ctx.stroke();
      return;
    }
  }
  if (type === 'lava') {
    const im = img('tile_lava');
    if (im) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.drawImage(im, x - 40, y - 28, 80, 56);
      // glow
      const pulse = 0.35 + Math.sin(animT * 5) * 0.1;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ff6d00';
      ctx.beginPath(); ctx.ellipse(x, y, 36, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }
  }
  if (type === 'castle') {
    // stacked dark tiles as castle
    const im = img('tile_dark');
    if (im) {
      ctx.drawImage(im, x - 48, y - 10, 96, 48);
      ctx.drawImage(im, x - 56, y - 40, 28, 56);
      ctx.drawImage(im, x + 28, y - 40, 28, 56);
      ctx.drawImage(im, x - 18, y - 52, 36, 36);
      // torch flames
      const fi = Math.floor(animT * 8) % 6;
      drawImg('fx_fire_' + fi, x - 42, y - 48, 20, 24);
      drawImg('fx_fire_' + fi, x + 42, y - 48, 20, 24);
      return;
    }
  }
  if (type === 'torch') {
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(x - 3, y, 6, 18);
    const fi = Math.floor(animT * 10) % 6;
    drawImg('fx_fire_' + fi, x, y - 4, 22, 26);
    return;
  }
  if (type === 'stump') {
    // large rock cluster as stump area
    drawImg('tile_rock2', x, y, s, s * 0.75);
    drawImg('tile_rock', x - 20, y + 8, 36, 28);
    drawImg('tile_rock3', x + 18, y + 6, 32, 26);
    return;
  }
  if (type === 'snowman') {
    drawImg('tile_rock3', x, y + 6, 28, 24);
    drawImg('tile_rock', x, y - 10, 22, 20);
    ctx.fillStyle = '#ff6d00';
    ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x + 10, y - 8); ctx.lineTo(x, y - 6); ctx.fill();
    return;
  }

  if (key && drawImg(key, x, y, s, s)) return;

  // fallback minimal shapes
  ctx.fillStyle = '#4caf50';
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
}

// ─── DRAW BLOON ──────────────────────────────────────────────
function drawBloon(b) {
  const def = BLOON_TYPES[b.type];
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.frozen > 0) ctx.globalAlpha = 0.9;

  if (def.moab) {
    drawMoab(b, def);
  } else {
    const r = def.radius;
    const size = r * 2.4;
    const key = 'bloon_' + b.type;
    const drawn = drawImg(key, 0, 0, size, size);
    if (!drawn) {
      // vector fallback
      ctx.fillStyle = b.frozen > 0 ? '#90caf9' : (def.color || '#888');
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.85, r, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (b.type === 'ceramic' && b.hp < b.maxHp) {
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(2, 0); ctx.lineTo(-3, 8); ctx.stroke();
    }
    if (b.camo) {
      ctx.strokeStyle = 'rgba(76,175,80,0.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.95, r * 1.05, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if (b.frozen > 0) {
    const fi = Math.floor((1 - Math.min(1, b.frozen / 2)) * 5);
    drawImg('fx_freeze_' + fi, 0, 0, def.radius * 2.8, def.radius * 2.8);
  }
  ctx.restore();
}

function drawMoab(b, def) {
  const r = def.radius;
  const hpPct = b.hp / b.maxHp;
  const key = 'bloon_' + b.type;
  const w = r * 2.6, h = r * 1.6;
  // slight bob / face direction along path
  ctx.save();
  ctx.rotate(Math.sin(b.propAngle) * 0.05);
  if (!drawImg(key, 0, 0, w, h)) {
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.3, r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (hpPct < 0.5) {
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -15); ctx.lineTo(5, 5); ctx.lineTo(-5, 18); ctx.stroke();
  }

  // health bar sprites
  const bw = r * 2, bh = 8;
  const barY = -r - 14;
  const bg = img('ui_bar_bg');
  if (bg) ctx.drawImage(bg, -bw / 2, barY, bw, bh);
  else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(-bw / 2, barY, bw, bh, 3); ctx.fill();
  }
  const fillKey = hpPct > 0.5 ? 'ui_bar_green' : hpPct > 0.25 ? 'ui_bar_yellow' : 'ui_bar_red';
  const fill = img(fillKey);
  if (fill) ctx.drawImage(fill, -bw / 2, barY, bw * hpPct, bh);
  else {
    ctx.fillStyle = hpPct > 0.5 ? '#4caf50' : hpPct > 0.25 ? '#ffc107' : '#f44336';
    roundRect(-bw / 2, barY, bw * hpPct, bh, 3); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(b.type.toUpperCase(), 0, barY - 6);
}

// ─── DRAW TOWER ──────────────────────────────────────────────
function drawTower(t, preview) {
  const def = TOWER_DEFS[t.type];
  const bob = preview ? 0 : Math.sin(t.bob) * 2;
  const size = TOWER_SIZES[t.type] || 48;
  ctx.save();
  ctx.translate(t.x, t.y + bob);

  // range circle when selected or preview
  if (selectedTower === t || preview) {
    ctx.strokeStyle = preview ? (canPlace(t.x, t.y) ? 'rgba(76,175,80,0.5)' : 'rgba(244,67,54,0.5)') : 'rgba(255,255,255,0.3)';
    ctx.fillStyle = preview ? (canPlace(t.x, t.y) ? 'rgba(76,175,80,0.1)' : 'rgba(244,67,54,0.1)') : 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -bob, t.range || def.range, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  // soft shadow
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, size * 0.28, size * 0.28, size * 0.12, 0, 0, Math.PI * 2); ctx.fill();

  const spriteKey = TOWER_SPRITES[t.type];
  const rot = (t.type === 'farm' || t.type === 'ice') ? 0 : (t.angle || 0);
  const drawn = drawImg(spriteKey, 0, -2, size, size, rot);

  if (!drawn) {
    // vector fallback (legacy)
    ctx.fillStyle = def.bodyColor;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(0, -12, 10, 0, Math.PI * 2); ctx.fill();
  }

  // type-specific FX accents
  if (t.type === 'ice') {
    const fi = Math.floor(animT * 4) % 6;
    ctx.globalAlpha = 0.55;
    drawImg('fx_freeze_' + fi, 0, 0, size * 1.1, size * 1.1);
    ctx.globalAlpha = 1;
  }
  if (t.type === 'wizard') {
    const mi = Math.floor(animT * 5) % 6;
    ctx.globalAlpha = 0.5;
    drawImg('fx_magic_' + mi, 0, -size * 0.2, 28, 28);
    ctx.globalAlpha = 1;
  }
  if (t.type === 'super' && t.upgradeLevel >= 3) {
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.45, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // upgrade stars
  if (t.upgradeLevel > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 2;
    ctx.fillText('★'.repeat(t.upgradeLevel), 0, size * 0.48);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ─── DRAW PROJECTILE ─────────────────────────────────────────
function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  const a = Math.atan2(p.vy, p.vx);
  const key = PROJ_SPRITES[p.projType];
  const sizes = {
    dart: 22, spike: 26, bomb: 18, fireball: 22, magic: 18, laser: 28,
    plasma: 28, tack: 16, sniper: 24, freeze: 20
  };
  const s = sizes[p.projType] || 16;
  if (key && drawImg(key, 0, 0, s, s, a)) {
    if (p.projType === 'magic' || p.projType === 'laser' || p.projType === 'plasma') {
      ctx.globalAlpha = 0.35;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  } else {
    ctx.rotate(a);
    ctx.fillStyle = p.color || '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ─── DRAW PARTICLES ──────────────────────────────────────────
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    if (p.type === 'sprite' && p.sheet) {
      const frame = Math.min(p.frames - 1, Math.floor((1 - a) * p.frames));
      const key = 'fx_' + p.sheet + '_' + frame;
      const im = img(key);
      if (im) {
        const sz = p.r || 40;
        ctx.drawImage(im, p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + (p.grow || 0) * (1 - a), 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.type === 'line') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x2, p.y2); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const f of floatTexts) {
    ctx.globalAlpha = f.life / f.maxLife;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 14px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ─── DRAW HUD ────────────────────────────────────────────────
function drawHUD() {
  // top bar
  if (!drawImgTL('ui_panel_md', 0, 0, W, 50)) {
    const tg = ctx.createLinearGradient(0, 0, 0, 50);
    tg.addColorStop(0, 'rgba(26,26,46,0.95)');
    tg.addColorStop(1, 'rgba(22,33,62,0.9)');
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, W, 50);
  }
  ctx.strokeStyle = 'rgba(255,215,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(W, 50); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 18px Segoe UI';
  // icons + text
  drawImgTL('ui_heart', 16, 10, 28, 28);
  ctx.fillStyle = '#ef5350';
  ctx.fillText(String(lives), 50, 25);
  drawImgTL('ui_coin', 120, 10, 28, 28);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('$' + cash.toLocaleString(), 154, 25);
  drawImgTL('ui_round', 280, 10, 28, 28);
  ctx.fillStyle = '#fff';
  ctx.fillText('Round ' + round + '/' + maxRounds, 314, 25);
  ctx.fillStyle = '#90caf9';
  ctx.font = '14px Segoe UI';
  ctx.fillText(MAPS[selectedMap].name + ' • ' + DIFFS[selectedDiff].name, 500, 25);

  // start round / auto
  drawButton(W-340, 8, 70, 34, autoStart ? 'AUTO' : 'Auto', autoStart ? '#4caf50' : '#546e7a');
  if (!roundActive && bloons.filter(b=>b.alive).length === 0) {
    const pulse = 1 + Math.sin(animT*4)*0.05;
    ctx.save();
    ctx.translate(W-210, 25);
    ctx.scale(pulse, pulse);
    ctx.translate(-(W-210), -25);
    drawButton(W-250, 8, 80, 34, '▶ GO', '#4caf50');
    ctx.restore();
  } else {
    drawButton(W-250, 8, 80, 34, '▶ GO', '#37474f');
  }
  drawButton(W-150, 8, 40, 34, gameSpeed + 'x', '#7c4dff');
  drawButton(W-50, 8, 40, 34, '⏸', '#546e7a');

  // bottom tower panel
  const py = H - 120;
  if (!drawImgTL('ui_panel_md', 0, py, W, 120)) {
    ctx.fillStyle = 'rgba(22, 33, 62, 0.92)';
    ctx.fillRect(0, py, W, 120);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();

  for (let i = 0; i < TOWER_ORDER.length; i++) {
    const type = TOWER_ORDER[i];
    const def = TOWER_DEFS[type];
    const tx = 20 + i * 130;
    const canAfford = cash >= def.cost;
    const selected = placingTower === type;
    ctx.fillStyle = selected ? 'rgba(255,215,0,0.25)' : canAfford ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.3)';
    roundRect(tx, py + 10, 120, 100, 8);
    ctx.fill();
    if (selected) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // tower sprite icon
    const sk = TOWER_SPRITES[type];
    ctx.save();
    if (!canAfford) ctx.globalAlpha = 0.4;
    if (!drawImg(sk, tx + 60, py + 42, 40, 40)) {
      ctx.fillStyle = canAfford ? def.color : '#555';
      ctx.beginPath(); ctx.arc(tx + 60, py + 40, 18, 0, Math.PI * 2); ctx.fill();
      ctx.font = '16px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText(def.icon, tx + 60, py + 42);
    }
    ctx.restore();
    ctx.font = 'bold 11px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillStyle = canAfford ? '#fff' : '#888';
    ctx.fillText(def.name.split(' ')[0], tx + 60, py + 72);
    ctx.fillStyle = canAfford ? '#ffd700' : '#666';
    ctx.font = 'bold 13px Segoe UI';
    ctx.fillText('$' + def.cost, tx + 60, py + 90);
  }

  // tower info panel
  if (selectedTower) {
    const t = selectedTower;
    const def = TOWER_DEFS[t.type];
    const px = W - 260, ipy = 60;
    panel(px, ipy, 250, 420, 0.92);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(def.icon + ' ' + def.name, px + 125, ipy + 25);
    ctx.fillStyle = '#bbb';
    ctx.font = '12px Segoe UI';
    ctx.fillText('Tier ' + t.upgradeLevel + '/3', px + 125, ipy + 45);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '13px Segoe UI';
    const stats = [
      'Damage: ' + t.damage,
      'Range: ' + (t.special === 'infinite_range' ? '∞' : Math.round(t.range)),
      'Fire Rate: ' + t.fireRate.toFixed(2) + 's',
      'Pierce: ' + t.pierce,
      t.income ? 'Income: $' + t.income + '/rd' : null,
      t.aoeRadius ? 'AoE: ' + t.aoeRadius + 'px' : null
    ].filter(Boolean);
    stats.forEach((s, i) => ctx.fillText(s, px + 15, ipy + 70 + i * 18));

    // upgrades
    for (let u = 0; u < 3; u++) {
      const up = def.upgrades[u];
      const uy = ipy + 160 + u * 55;
      const owned = t.upgradeLevel > u;
      const next = t.upgradeLevel === u;
      const canBuy = next && cash >= up.cost;
      ctx.fillStyle = owned ? 'rgba(76,175,80,0.3)' : canBuy ? 'rgba(255,215,0,0.2)' : 'rgba(0,0,0,0.3)';
      roundRect(px + 10, uy, 230, 50, 6);
      ctx.fill();
      if (next) { ctx.strokeStyle = canBuy ? '#ffd700' : '#666'; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.fillStyle = owned ? '#81c784' : canBuy ? '#fff' : '#888';
      ctx.font = 'bold 12px Segoe UI';
      ctx.textAlign = 'left';
      ctx.fillText((owned ? '✓ ' : '') + up.name, px + 18, uy + 18);
      ctx.font = '11px Segoe UI';
      ctx.fillStyle = '#aaa';
      ctx.fillText(up.desc, px + 18, uy + 35);
      if (!owned) {
        ctx.fillStyle = canBuy ? '#ffd700' : '#666';
        ctx.textAlign = 'right';
        ctx.fillText('$' + up.cost, px + 230, uy + 25);
      }
    }

    // targeting
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(px + 10, ipy + 330, 230, 30, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('Target: ' + t.targeting.toUpperCase() + ' ↻', px + 125, ipy + 346);

    // sell / close
    drawButton(px + 10, ipy + 370, 110, 35, 'Sell $' + Math.floor(t.totalCost * 0.7), '#e53935');
    drawButton(px + 130, ipy + 370, 110, 35, 'Close', '#546e7a');
  }

  // placement preview
  if (placingTower) {
    const def = TOWER_DEFS[placingTower];
    const valid = canPlace(mouse.x, mouse.y) && mouse.y < H - 130;
    ctx.globalAlpha = 0.7;
    drawTower({ type: placingTower, x: mouse.x, y: mouse.y, range: def.range, angle: 0, upgradeLevel: 0, bob: 0 }, true);
    ctx.globalAlpha = 1;
    // cost
    ctx.fillStyle = valid ? '#4caf50' : '#f44336';
    ctx.font = 'bold 14px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('$' + def.cost + (valid ? '' : ' (invalid)'), mouse.x, mouse.y - 40);
  }
}

// ─── SCREENS ─────────────────────────────────────────────────
function drawMainMenu() {
  // animated bg
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#1a1a2e');
  g.addColorStop(0.5, '#16213e');
  g.addColorStop(1, '#0f3460');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // floating balloon sprites
  const menuBloons = ['bloon_red','bloon_blue','bloon_green','bloon_yellow','bloon_pink','bloon_purple'];
  for (let i = 0; i < 12; i++) {
    const x = (i * 137 + animT * 20 * (i%2?1:-1)) % (W + 40) - 20;
    const y = 100 + Math.sin(animT + i) * 30 + (i * 50) % 400;
    if (!drawImg(menuBloons[i % menuBloons.length], x, y, 32, 40)) {
      const colors = ['#e53935','#1e88e5','#43a047','#fdd835','#ec407a','#8e24aa'];
      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath(); ctx.ellipse(x, y, 14, 18, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  // decorative monkeys
  drawMenuMonkey(150, H/2 + 50, animT);
  drawMenuMonkey(W - 150, H/2 + 50, animT + 1);

  // title
  ctx.save();
  const titleY = 160 + Math.sin(animT * 1.5) * 5;
  ctx.font = 'bold 64px Segoe UI, Arial';
  ctx.textAlign = 'center';
  const tg = ctx.createLinearGradient(W/2 - 200, titleY, W/2 + 200, titleY);
  tg.addColorStop(0, '#ff6d00');
  tg.addColorStop(0.3, '#ffd700');
  tg.addColorStop(0.6, '#4caf50');
  tg.addColorStop(1, '#2196f3');
  ctx.fillStyle = tg;
  ctx.shadowColor = 'rgba(255,215,0,0.5)';
  ctx.shadowBlur = 20;
  ctx.fillText('MONKEY DEFENSE 6', W/2, titleY);
  ctx.shadowBlur = 0;
  ctx.font = '20px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Pop Bloons • Place Monkeys • Save the World', W/2, titleY + 45);
  ctx.restore();

  // play button pulse
  const pulse = 1 + Math.sin(animT * 3) * 0.04;
  ctx.save();
  ctx.translate(W/2, H/2 + 50);
  ctx.scale(pulse, pulse);
  ctx.translate(-W/2, -(H/2 + 50));
  drawButton(W/2 - 120, H/2 + 20, 240, 60, '▶️  PLAY', '#4caf50');
  ctx.restore();

  // mute
  drawButton(W - 80, 20, 50, 40, muted ? '🔇' : '🔊', '#546e7a');

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '13px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('Inspired by Bloons TD • Pure Canvas • No Dependencies', W/2, H - 30);
}

function drawMenuMonkey(x, y, t) {
  ctx.save();
  ctx.translate(x, y + Math.sin(t*2)*5);
  ctx.fillStyle = '#8d6e63';
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#a1887f';
  ctx.beginPath(); ctx.arc(0, -25, 20, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-7, -27, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -27, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#212121';
  ctx.beginPath(); ctx.arc(-6, -27, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -27, 2.5, 0, Math.PI*2); ctx.fill();
  // arm wave
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(25, -5);
  ctx.lineTo(40, -20 + Math.sin(t*4)*15);
  ctx.stroke();
  ctx.restore();
}

function drawMapSelect() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 36px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('SELECT MAP', W/2, 60);

  for (let i = 0; i < MAPS.length; i++) {
    const map = MAPS[i];
    const col = i % 3, row = Math.floor(i / 3);
    const x = 140 + col * 340, y = 140 + row * 240;
    const unlocked = unlockedMaps[i];
    const hover = unlocked && hitBtn(x, y, 300, 200);

    panel(x, y, 300, 200, unlocked ? 0.9 : 0.5);
    if (hover) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      roundRect(x, y, 300, 200, 12);
      ctx.stroke();
    }

    // mini preview
    ctx.save();
    ctx.beginPath();
    roundRect(x + 15, y + 15, 270, 100, 8);
    ctx.clip();
    ctx.fillStyle = map.bg;
    ctx.fillRect(x + 15, y + 15, 270, 100);
    // mini path
    ctx.strokeStyle = '#a1887f';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const pathData = map.multiPath ? map.path : map.path;
    pathData.forEach((p, j) => {
      const px = x + 15 + p.x * 270, py = y + 15 + p.y * 100;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.restore();

    if (!unlocked) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(x, y, 300, 200, 12);
      ctx.fill();
      ctx.font = '40px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('🔒', x + 150, y + 100);
    }

    ctx.fillStyle = unlocked ? '#fff' : '#888';
    ctx.font = 'bold 18px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(map.name, x + 150, y + 140);
    ctx.fillStyle = '#ffd700';
    ctx.font = '16px Segoe UI';
    ctx.fillText(stars(map.difficulty), x + 150, y + 165);
    const diffs = ['Beginner','Beginner','Intermediate','Advanced','Expert'];
    ctx.fillStyle = '#90caf9';
    ctx.font = '12px Segoe UI';
    ctx.fillText(diffs[map.difficulty], x + 150, y + 185);
  }

  drawButton(40, H - 70, 120, 40, '← Back', '#546e7a');
}

function drawDiffSelect() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 36px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('SELECT DIFFICULTY', W/2, 80);
  ctx.fillStyle = '#fff';
  ctx.font = '20px Segoe UI';
  ctx.fillText(MAPS[selectedMap].name, W/2, 130);

  for (let i = 0; i < 4; i++) {
    const d = DIFFS[i];
    const x = 180 + i * 240, y = 280;
    const hover = hitBtn(x, y, 200, 160);
    panel(x, y, 200, 160, 0.9);
    if (hover) {
      ctx.strokeStyle = d.color;
      ctx.lineWidth = 3;
      roundRect(x, y, 200, 160, 12);
      ctx.stroke();
    }
    ctx.font = '36px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(d.icon, x + 100, y + 45);
    ctx.fillStyle = d.color;
    ctx.font = 'bold 22px Segoe UI';
    ctx.fillText(d.name, x + 100, y + 80);
    ctx.fillStyle = '#ccc';
    ctx.font = '13px Segoe UI';
    ctx.fillText(d.lives + ' lives', x + 100, y + 110);
    ctx.fillText('$' + d.cash + ' start', x + 100, y + 130);
    ctx.fillStyle = '#fff';
  }
  drawButton(40, H - 70, 120, 40, '← Back', '#546e7a');
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  panel(W/2 - 160, H/2 - 140, 320, 300, 0.95);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 32px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W/2, H/2 - 90);
  ctx.fillStyle = '#aaa';
  ctx.font = '14px Segoe UI';
  ctx.fillText('Round ' + round + ' • $' + cash + ' • ❤️' + lives, W/2, H/2 - 55);
  drawButton(W/2 - 100, H/2 - 40, 200, 45, '▶ Resume', '#4caf50');
  drawButton(W/2 - 100, H/2 + 20, 200, 45, '🔄 Restart', '#ff9800');
  drawButton(W/2 - 100, H/2 + 80, 200, 45, '🏠 Quit to Menu', '#e53935');
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  panel(W/2 - 200, H/2 - 160, 400, 360, 0.95);
  ctx.fillStyle = '#f44336';
  ctx.font = 'bold 40px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('💀 GAME OVER', W/2, H/2 - 100);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Segoe UI';
  ctx.fillText('Reached Round ' + round + '/' + maxRounds, W/2, H/2 - 50);
  ctx.fillText('Bloons Popped: ' + totalPopped, W/2, H/2 - 20);
  ctx.fillText('Cash Spent: $' + totalSpent, W/2, H/2 + 10);
  drawButton(W/2 - 100, H/2 + 80, 200, 45, '🔄 Retry', '#ff9800');
  drawButton(W/2 - 100, H/2 + 140, 200, 45, '🏠 Menu', '#546e7a');
}

function drawVictory() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  // confetti
  for (let i = 0; i < 30; i++) {
    const x = (i * 97 + animT * 50) % W;
    const y = (i * 53 + animT * 80) % H;
    ctx.fillStyle = ['#ffd700','#4caf50','#2196f3','#e91e63','#ff9800'][i%5];
    ctx.fillRect(x, y, 6, 10);
  }
  panel(W/2 - 200, H/2 - 160, 400, 360, 0.95);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 40px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 VICTORY!', W/2, H/2 - 100);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Segoe UI';
  ctx.fillText(MAPS[selectedMap].name + ' cleared!', W/2, H/2 - 50);
  ctx.fillText('Bloons Popped: ' + totalPopped, W/2, H/2 - 20);
  ctx.fillText('Difficulty: ' + DIFFS[selectedDiff].name, W/2, H/2 + 10);
  if (selectedMap < 4) {
    ctx.fillStyle = '#81c784';
    ctx.fillText('Map unlocked: ' + MAPS[selectedMap+1].name, W/2, H/2 + 45);
  }
  drawButton(W/2 - 100, H/2 + 80, 200, 45, '🔄 Play Again', '#4caf50');
  drawButton(W/2 - 100, H/2 + 140, 200, 45, '🏠 Menu', '#546e7a');
}

// ─── LOADING SCREEN ──────────────────────────────────────────
function drawLoading() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 36px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('MONKEY DEFENSE 6', W / 2, H / 2 - 60);
  ctx.fillStyle = '#90caf9';
  ctx.font = '18px Segoe UI';
  ctx.fillText('Loading professional assets…', W / 2, H / 2 - 20);
  // bar
  const bw = 400, bh = 18, bx = W / 2 - bw / 2, by = H / 2 + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(bx, by, bw, bh, 8); ctx.fill();
  ctx.fillStyle = '#4caf50';
  roundRect(bx, by, bw * assetLoadProgress, bh, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  roundRect(bx, by, bw, bh, 8); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '14px Segoe UI';
  ctx.fillText(Math.floor(assetLoadProgress * 100) + '%', W / 2, by + 40);
  if (assetLoadError) {
    ctx.fillStyle = '#ff9800';
    ctx.font = '12px Segoe UI';
    ctx.fillText('Some assets missing (fallback graphics active): ' + assetLoadError, W / 2, by + 64);
  }
}

// ─── MAIN RENDER ─────────────────────────────────────────────
function render() {
  // clear full canvas
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // game transform
  ctx.setTransform(scale, 0, 0, scale, ox, oy);

  // letterbox bg for game area
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (!assetsReady) {
    drawLoading();
    return;
  }

  switch (gameState) {
    case State.MAIN_MENU:
      drawMainMenu();
      break;
    case State.MAP_SELECT:
      drawMapSelect();
      break;
    case State.DIFFICULTY_SELECT:
      drawDiffSelect();
      break;
    case State.GAMEPLAY:
    case State.PAUSE:
    case State.GAME_OVER:
    case State.VICTORY:
      drawMap();
      // fire patches (sprite flames)
      for (const fp of firePatches) {
        const lifeA = fp.life / fp.maxLife;
        ctx.globalAlpha = 0.75 * lifeA;
        const fi = Math.floor(animT * 10 + fp.x) % 6;
        const im = img('fx_fire_' + fi);
        if (im) {
          const s = fp.r * 1.6;
          ctx.drawImage(im, fp.x - s / 2, fp.y - s / 2, s, s);
          ctx.drawImage(im, fp.x - s * 0.3, fp.y - s * 0.4, s * 0.7, s * 0.7);
        } else {
          const fg = ctx.createRadialGradient(fp.x, fp.y, 2, fp.x, fp.y, fp.r);
          fg.addColorStop(0, '#ffab00');
          fg.addColorStop(0.5, '#ff6d00');
          fg.addColorStop(1, 'rgba(255,0,0,0)');
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      for (const t of towers) drawTower(t);
      for (const b of bloons) if (b.alive) drawBloon(b);
      for (const p of projectiles) drawProjectile(p);
      drawParticles();
      drawHUD();
      if (gameState === State.PAUSE) drawPause();
      if (gameState === State.GAME_OVER) drawGameOver();
      if (gameState === State.VICTORY) drawVictory();
      break;
  }

  // reset click after handling
}

// ─── GAME LOOP ───────────────────────────────────────────────
function loop(now) {
  dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (assetsReady) {
    handleClick();
    update(dt);
  } else {
    animT += dt;
  }
  render();
  requestAnimationFrame(loop);
}

// init menu clouds
for (let i = 0; i < 8; i++) {
  menuClouds.push({ x: rand(0, W), y: rand(50, 300), s: rand(0.3, 1), sp: rand(10, 30) });
}

lastTime = performance.now();
// Preload assets then start loop (loop also renders loading bar)
loadAssets().then(() => {
  console.log('MD6 assets ready:', Object.keys(ASSETS).length);
});
requestAnimationFrame(loop);

})();
</script>
